<tr><td>六、归结反演与2024大题</td><td>CNF转换七步、Skolem化三情形、归结证明流程、“小明很高兴”完整解答</td><td>9.5</td><td>★★★★★</td></tr>

</tbody></table></div>
<h3>为什么说三章是一条链</h3>
<ul><li>第7章回答“机器如何拥有知识并推理”：知识库KB存语句，Ask时用推理算法推出结论；命题逻辑是最简单的表示语言，但只能表达“一个个孤立事实”。</li></ul>
<ul><li>第8章回答“事实内部结构如何表示”：把原子命题拆成对象+谓词+量词，表达力大增（“所有人都会死”一句话顶命题逻辑无穷条）。</li></ul>
<ul><li>第9章回答“更强的表示如何自动推理”：合一找到置换、GMP推广假言推理、归结反演给出完备证明程序——历年大题全在这里。</li></ul>

<div class=&quot;module-card&quot; id=&quot;section-2&quot;><div class=&quot;module-header&quot; onclick=&quot;toggleModule(this)&quot;><h2><span class=&quot;module-num&quot;>2</span>模块一：知识库与逻辑Agent（7.1-7.3）</h2><span class=&quot;module-toggle&quot;>▼</span></div><div class=&quot;module-body&quot;>
<h3>1.1 核心名词定义</h3>
<p><span class=&quot;def-term&quot;>【基于知识的Agent（Knowledge-based Agent）】</span>以知识库为核心的Agent：内部存储用形式语言表示的语句集合，通过对知识库进行推理来决定行动。体系结构 = 域独立的推理引擎（算法） + 域相关的知识库（内容）。</p>
<p><span class=&quot;def-term&quot;>【知识库（KB, Knowledge Base）】</span>一种形式语言的语句集合，是Agent关于世界的全部知识。注意：KB是语句的集合，不是“事实本身”——语句是对世界的表示。</p>
<p><span class=&quot;def-term&quot;>【公理（Axiom）】</span>预先给定的、而不是从其他语句推导出来的语句。公理是知识库的初始内容。</p>
<p><span class=&quot;def-term&quot;>【Tell 与 Ask】</span>知识库的两个基本操作：<b>Tell</b>：向KB添加新语句（告诉它新感知/新知识）；<b>Ask</b>：向KB查询某语句是否被蕴含（问它结论是否成立）。</p>
<p>基于知识的Agent的5项能力要求（教材7.1）：</p>
<ul><li>表示状态、行动等（表示能力）</li><li>引入新的感知信息（Tell）</li><li>更新世界的表示（维护KB一致性）</li><li>推导世界的潜在属性（推理出未直接感知的事实）</li><li>推导正确的行为（决定下一步行动）</li></ul>
<h3>1.2 逻辑三要素：语法、语义、模型</h3>
<p><span class=&quot;def-term&quot;>【逻辑（Logic）】</span>一种用来表示信息的形式语言，该语言能够推导出一定的结论。</p>
<p><span class=&quot;def-term&quot;>【语法（Syntax）】</span>定义语言中合法语句的规范准则（“怎么写才算合法”）。</p>
<p><span class=&quot;def-term&quot;>【语义（Semantics）】</span>定义语句的含义，即每个语句在每个可能世界中的真值（“写了是什么意思”）。</p>
<p><span class=&quot;def-term&quot;>【模型（Model）】</span>“可能世界”的数学抽象——对真实世界的一种数学化建模。命题逻辑中一个模型就是对每个命题符号的一次真值指派。M(α) 表示使语句 α 为真的所有模型的集合。</p>
<h3>1.3 蕴含与推理（本章最核心的两个符号）</h3>
<p><span class=&quot;def-term&quot;>【逻辑蕴含（Entailment）】</span>记作 α ⊨ β：语句 β 在逻辑上跟随 α——在使 α 为真的<b>每一个</b>模型中，β 也为真。等价判据：<b>α ⊨ β 当且仅当 M(α) ⊆ M(β)</b>（α 的模型集是 β 的模型集的子集）。KB ⊨ α 同理。</p>
<div class=&quot;formula-box&quot;>α ⊨ β  ⟺  M(α) ⊆ M(β)　　（形象记忆：蕴含就像干草堆 KB 中的一根针 α，推理的目的就是找到这根针）</div>
<p><span class=&quot;def-term&quot;>【推理/推导（Inference）】</span>记作 KB ⊢ᵢ α：推理算法 i 能够根据 KB 推导出语句 α。⊢ 是语法层面的符号推演，⊨ 是语义层面的真值关系——两者方向相反地互相校验。</p>
<h3>1.4 可靠性与完备性（高频名词解释）</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>性质</th><th>定义</th><th>形式化</th><th>通俗理解</th></tr></thead><tbody>
<tr><td><b>可靠性</b>（Soundness）</td><td>推理算法 i 推导出的任何语句都是被 KB 蕴含的</td><td>若 KB ⊢ᵢ α 则 KB ⊨ α</td><td>“推出的都是对的”，不撒谎、不产生假结论</td></tr>
<tr><td><b>完备性</b>（Completeness）</td><td>凡是被 KB 蕴含的语句，算法 i 都能推导出来</td><td>若 KB ⊨ α 则 KB ⊢ᵢ α</td><td>“对的都能推出”，不遗漏、不放过真结论</td></tr>
</tbody></table></div>
<p>记忆锚点：可靠性守住“不乱说”，完备性保证“都说全”。归结反演对命题逻辑和一阶逻辑的确定子句都是<b>可靠且完备</b>的（完备性指反驳完备：KB∧¬α 不可满足时必能推出空子句）。</p>
<h3>1.5 两大类证明途径</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>途径</th><th>做法</th><th>代表算法</th><th>特点</th></tr></thead><tbody>
<tr><td><b>推理规则（定理证明）</b></td><td>从旧语句出发，应用推理规则产生新语句，证明 = 一系列推理规则的应用</td><td>假言推理、归结反演</td><td>通常需先转成范式（如CNF）；符号推演，不必枚举模型</td></tr>
<tr><td><b>模型检查（Model Checking）</b></td><td>直接枚举/搜索所有可能模型，检验 M(KB)⊆M(α) 是否成立</td><td>真值表枚举（穷举）、在模型空间中启发式搜索（如A*）、DPLL</td><td>概念直观但模型数随命题符号数指数爆炸（2ⁿ）</td></tr>
</tbody></table></div>
</div></div>

<h3>2.2 命题符号化与知识库规则</h3>
<p>用命题符号表示世界：<b>Pᵢ,ⱼ</b> 表示 [i,j] 有无底洞；<b>Bᵢ,ⱼ</b> 表示 [i,j] 感到微风；Wᵢ,ⱼ / Sᵢ,ⱼ 同理（Wumpus/恶臭）。</p>
<p>知识库中的核心规则（每个格子一条双条件规则）：</p>
<div class=&quot;formula-box&quot;>B₁,₁ ⇔ (P₁,₂ ∨ P₂,₁)　　（[1,1]有微风 ⟺ [1,2]或[2,1]有洞）</div>
<ul><li>初始事实：¬P₁,₁（起点无洞）、¬W₁,₁（起点无怪兽）</li><li>感知转化：Agent 在 [1,1] 未感到微风 → Tell(KB, ¬B₁,₁)；走到 [2,1] 感到微风 → Tell(KB, B₂,₁)</li><li>典型推理：由 B₁,₁⇔(P₁,₂∨P₂,₁) 与 ¬B₁,₁ 可推出 ¬P₁,₂ ∧ ¬P₂,₁，即 [1,2]、[2,1] 安全（标 OK）</li></ul>
<p>这个“规则 ⇔ + 感知事实 → 推出安全格”的模式，就是后面 CNF 转换与归结的直接素材：</p>

<div class=&quot;module-card&quot; id=&quot;section-4&quot;><div class=&quot;module-header&quot; onclick=&quot;toggleModule(this)&quot;><h2><span class=&quot;module-num&quot;>4</span>模块三：命题逻辑（7.4-7.7）</h2><span class=&quot;module-toggle&quot;>▼</span></div><div class=&quot;module-body&quot;>
<h3>3.1 语法：连接词与优先级</h3>
<p><span class=&quot;def-term&quot;>【命题逻辑】</span>应用一套形式化规则对以符号表示的描述性陈述进行推理的系统。它假定世界由一个个事实组成，每个原子语句是最基本单位，不可再分解。</p>
<p><span class=&quot;def-term&quot;>【原子语句】</span>由单个命题词组成，每个命题词代表一个非真即假的命题。<span class=&quot;def-term&quot;>【复合语句】</span>由原子语句经连接词组合而成。</p>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>连接词</th><th>符号</th><th>名称</th><th>优先级（高→低）</th></tr></thead><tbody>
<tr><td>非</td><td>¬</td><td>否定</td><td>1（最高）</td></tr>
<tr><td>与</td><td>∧</td><td>合取</td><td>2</td></tr>
<tr><td>或</td><td>∨</td><td>析取</td><td>3</td></tr>
<tr><td>条件/蕴含</td><td>⇒</td><td>蕴含式</td><td>4</td></tr>
<tr><td>双向条件</td><td>⇔</td><td>等价式</td><td>5（最低）</td></tr>
</tbody></table></div>
<h3>3.2 语义与真值表</h3>
<p>命题逻辑的模型 = 对每个命题符号指定真值。n 个命题符号共 2ⁿ 个模型。真值表给出复合语句在每种指派下的真值：</p>

<tr><td>T</td><td>T</td><td>F</td><td>T</td><td>T</td><td>T</td><td>T</td></tr>
<tr><td>T</td><td>F</td><td>F</td><td>F</td><td>T</td><td><b>F</b></td><td>F</td></tr>
<tr><td>F</td><td>T</td><td>T</td><td>F</td><td>T</td><td>T</td><td>F</td></tr>
<tr><td>F</td><td>F</td><td>T</td><td>F</td><td>F</td><td>T</td><td>T</td></tr>
</tbody></table></div>
<p>易错点：P⇒Q 仅在 “P真且Q假” 时为假（前件为假时蕴含式恒真，称为“空虚真”）。</p>
<h3>3.3 逻辑等价</h3>
<p><span class=&quot;def-term&quot;>【逻辑等价】</span>若两个语句 α、β 在同样的模型集合中为真，则它们逻辑等价，记作 <b>α ≡ β</b>。判据：<b>α ≡ β 当且仅当 α ⊨ β 且 β ⊨ α</b>（互相蕴含）。</p>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>等价式</th><th>名称</th></tr></thead><tbody>
<tr><td>(α∧β) ≡ (β∧α)；(α∨β) ≡ (β∨α)</td><td>交换律</td></tr>
<tr><td>((α∧β)∧γ) ≡ (α∧(β∧γ))；析取同理</td><td>结合律</td></tr>
<tr><td>¬(¬α) ≡ α</td><td>双重否定</td></tr>
<tr><td>(α⇒β) ≡ (¬β⇒¬α)</td><td>逆否（换质换位）</td></tr>
<tr><td>(α⇒β) ≡ (¬α∨β)</td><td><b>蕴含消去</b>（转CNF第②步核心）</td></tr>
<tr><td>(α⇔β) ≡ ((α⇒β)∧(β⇒α))</td><td><b>等价消去</b>（转CNF第①步核心）</td></tr>
<tr><td>¬(α∧β) ≡ (¬α∨¬β)；¬(α∨β) ≡ (¬α∧¬β)</td><td><b>De Morgan定律</b>（否定内移核心）</td></tr>
<tr><td>(α∧(β∨γ)) ≡ ((α∧β)∨(α∧γ))；(α∨(β∧γ)) ≡ ((α∨β)∧(α∨γ))</td><td>分配律</td></tr>
</tbody></table></div>
<h3>3.4 有效、可满足、不可满足（必考三性）</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>性质</th><th>定义</th><th>例子</th></tr></thead><tbody>
<tr><td><b>有效的（永真式）</b>Valid</td><td>在所有模型中都为真</td><td>P∨¬P</td></tr>
<tr><td><b>可满足的</b>Satisfiable</td><td>在某一（至少一个）模型中为真</td><td>P∨Q</td></tr>
<tr><td><b>不可满足的</b>Unsatisfiable</td><td>在所有模型中都为假（无模型使其为真）</td><td>P∧¬P</td></tr>
</tbody></table></div>
<div class=&quot;formula-box&quot;>α 有效 ⟺ ¬α 不可满足；　α 可满足 ⟺ ¬α 非有效　　—— 这是归结反演“证 KB∧¬α 不可满足”的理论根基</div>
<h3>3.5 推理规则六条（定理证明的积木）</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>规则</th><th>英文/简称</th><th>形式</th><th>说明</th></tr></thead><tbody>
<tr><td>假言推理/分离规则</td><td>Modus Ponens (M.P.)</td><td>α⇒β，α ⊢ β</td><td>肯定前件就要肯定后件；逆否形式：否定后件就要否定前件</td></tr>
<tr><td>消去合取词/与消解</td><td>And-Elimination (A.E.)</td><td>α∧β ⊢ α</td><td>合取为真则每个合取支为真</td></tr>
<tr><td>与导入</td><td>And-Introduction</td><td>α，β ⊢ α∧β</td><td>与消解的逆过程</td></tr>
<tr><td>双重否定消去</td><td>Double-Negation</td><td>¬¬α ⊢ α</td><td>双重否定等于没否</td></tr>
<tr><td>单项消解/单项归结</td><td>Unit Resolution</td><td>α∨β，¬β ⊢ α</td><td>归结的特例</td></tr>
<tr><td><b>消解/归结</b>★</td><td>Resolution</td><td>α∨β，¬β∨γ ⊢ α∨γ</td><td>互补文字 β 与 ¬β 相消，其余文字取析取</td></tr>
</tbody></table></div>
<div class=&quot;formula-box&quot;>归结一般式：(l₁∨…∨lₖ) ∧ (m₁∨…∨mₙ)，若 lᵢ 与 mⱼ 互补，则 ⊢ l₁∨…∨lᵢ₋₁∨lᵢ₊₁∨…∨lₖ ∨ m₁∨…∨mⱼ₋₁∨mⱼ₊₁∨…∨mₙ</div>
<h3>3.6 合取范式 CNF 与命题归结反演</h3>
<p><span class=&quot;def-term&quot;>【合取范式（CNF）】</span>由若干子句（clause）的合取组成，每个子句是若干文字的析取，形如 (A∨B) ∧ (C∨D∨¬E)。命题逻辑每个语句都可转换为CNF。</p>
<p>命题逻辑转CNF四步（对照模块二的 Wumpus 例图）：</p>
<ul><li>① 消去等价词：α⇔β → (α⇒β)∧(β⇒α)</li><li>② 消去蕴含词：α⇒β → ¬α∨β</li><li>③ 否定内移：De Morgan + 双重否定，使 ¬ 只作用于原子符号</li><li>④ 分配律：∨ 对 ∧ 分配，化为子句的合取</li></ul>
<p><span class=&quot;def-term&quot;>【归结反演（反证法）】</span>欲证明 KB ⊨ α，只需证明 <b>KB ∧ ¬α 不可满足</b>：将 KB 与结论的否定一起转成CNF子句集，反复归结；若推出<b>空子句 □</b>（矛盾），则原结论得证。</p>
<h3>3.7 命题逻辑推理算法：DPLL 与 WalkSAT</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>算法</th><th>类型</th><th>思想</th><th>完备性</th></tr></thead><tbody>
<tr><td><b>DPLL</b></td><td>深度优先回溯搜索</td><td>解决CNF布尔可满足性；实质是深搜CNF的取值，带三大改进</td><td><b>完备</b></td></tr>
<tr><td><b>WalkSAT</b></td><td>局部搜索（爬山/随机游走）</td><td>每次迭代选一个未满足的子句，翻转其中某符号；评估函数 = 最小化不满足子句的数量</td><td>不完备</td></tr>
</tbody></table></div>
<p>DPLL 相对朴素枚举的三大改进（考试常考列举）：</p>
<ul><li>① <b>及早终止</b>：子句中任一文字为真则该子句为真；所有文字为假则该子句为假——不必等全部符号赋值完。</li><li>② <b>纯符号启发式</b>：在所有子句中只以正（或只以负）形式出现的符号称为纯符号，直接赋值使其为真。例：(A∨¬B)∧(¬C∨¬B)∧(C∨A) 中 A、B 是纯符号，C 不是。</li><li>③ <b>单元子句启发式</b>：除某文字外其余文字都为假的子句（单元子句），该文字必须赋真。例：已知 B 为真，则 (¬C∨¬B) 变为单元子句 ¬C，故 C 必须为假。</li></ul>
<p>WalkSAT 翻转符号的两种选择策略：① 以一定概率随机挑选符号（随机游走，跳出局部最优）；② 选择使新状态下未满足语句数量最小的符号（贪心）。</p>
</div></div>
<div class=&quot;module-card&quot; id=&quot;section-5&quot;><div class=&quot;module-header&quot; onclick=&quot;toggleModule(this)&quot;><h2><span class=&quot;module-num&quot;>5</span>模块四：一阶逻辑（第8章）</h2><span class=&quot;module-toggle&quot;>▼</span></div><div class=&quot;module-body&quot;>
<h3>4.1 为什么需要一阶逻辑：命题逻辑的局限</h3>
<ul><li>命题逻辑中每个陈述句是最基本单位（原子命题），<b>无法对原子命题进行分解</b>；</li><li>不能表达<b>局部与整体、一般与个别</b>的关系（如“所有人都会死”必须逐人枚举，实际上写不完）。</li></ul>
<p><span class=&quot;def-term&quot;>【一阶逻辑/谓词逻辑（FOL）】</span>假定世界包含<b>对象、关系、函数</b>。原子命题被细化为个体、谓词和量词，从而表达个体与总体的内在联系和数量关系。</p>
<h3>4.2 语法基本元素（教材图8.x）</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>元素</th><th>示例</th><th>指代</th></tr></thead><tbody>
<tr><td>常量符号</td><td>Hunan, University, John</td><td>对象（个体）</td></tr>
<tr><td>谓词符号</td><td>Brother, >, Student</td><td>关系（性质是一元关系）</td></tr>
<tr><td>函词/函数符号</td><td>Sqrt, LeftLegOf</td><td>函数</td></tr>
<tr><td>变量</td><td>x, y, a, b</td><td>不特指的个体</td></tr>
<tr><td>连接词</td><td>∧ ∨ ¬ ⇒ ⇔</td><td>同命题逻辑</td></tr>
<tr><td>量词</td><td>∀（全称） ∃（存在）</td><td>表达数量</td></tr>
<tr><td>等词</td><td>=</td><td>两个项指同一对象</td></tr>
</tbody></table></div>
<h3>4.3 谓词 vs 函词（高频辨析）</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>对比</th><th>谓词 Predicate</th><th>函词 Function</th></tr></thead><tbody>
<tr><td>映射</td><td>个体域 → {True, False}</td><td>个体域 → 个体域（值域仍是个体）</td></tr>
<tr><td>代入常量后</td><td>变成命题（可真可假）</td><td>仍是另一个个体（对象）</td></tr>
<tr><td>例子</td><td>Car(x) 表“x是车”，Car(吉普车) 是命题</td><td>f(x)=x+10，f(2)=12 仍是数</td></tr>
<tr><td>元数</td><td>P(x) 一元谓词；P(x₁,…,xₙ) n元谓词</td><td>同样可以多元，如 father(x,y) 式写法属于谓词</td></tr>
</tbody></table></div>
<h3>4.4 量词：∀ 与 ∃（考试核心）</h3>
<p><span class=&quot;def-term&quot;>【全称量词 ∀】</span>表示“一切的、凡是的、所有的、每一个”。∀x P(x) 表示定义域中所有个体都具有性质 P。</p>
<p><span class=&quot;def-term&quot;>【存在量词 ∃】</span>表示“存在、有一个、某些”。∃x P(x) 表示定义域中至少存在一个个体具有性质 P。</p>
<div class=&quot;quick-card&quot;><b>搭配铁律（历年改卷扣分重灾区）：</b>
<ul><li><b>全称量词 ∀ 通常搭配蕴含 ⇒</b>：∀x Student(x)⇒Smart(x)。若误用 ∧，则变成“万物皆学生且皆聪明”，把定义域里所有东西都拉进学生集合——过强。</li><li><b>存在量词 ∃ 通常搭配合取 ∧</b>：∃x Student(x)∧Smart(x)。若误用 ⇒，则只要存在一个非学生该式就为真——过弱。</li></ul></div>
<h3>4.5 量词的顺序与否定</h3>
<ul><li>同类量词可交换：∀x∀y ≡ ∀y∀x；∃x∃y ≡ ∃y∃x。</li><li><b>混合量词不可随意交换</b>：∀x∃y Loves(x,y) = “每个人都有心爱的人”（y 随 x 而变）；∃y∀x Loves(x,y) = “存在一个被所有人爱的人”（同一个 y）。含义完全不同。</li><li>量词否定（De Morgan 推广）：<b>¬∀x p ≡ ∃x ¬p；¬∃x p ≡ ∀x ¬p</b>——否定穿过量词时量词互换。</li></ul>
<h3>4.6 量词的引入与消去（四条规则）</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>规则</th><th>英文/缩写</th><th>形式</th><th>要点</th></tr></thead><tbody>
<tr><td>全称量词消去</td><td>Universal Instantiation, UI</td><td>∀x A(x) ⊢ A(y)</td><td>可用<b>任何</b>常数/基项置换</td></tr>
<tr><td>全称量词引入</td><td>Universal Generalization, UG</td><td>A(y) ⊢ ∀x A(x)</td><td>要求 y 是任意个体（非特指）</td></tr>
<tr><td>存在量词消去</td><td>Existential Instantiation, EI</td><td>∃x A(x) ⊢ A(c)</td><td>c 必须是<b>新常量</b>（KB中未出现过，即Skolem常元）</td></tr>
<tr><td>存在量词引入</td><td>Existential Generalization, EG</td><td>A(c) ⊢ ∃x A(x)</td><td>由具体实例泛化出存在结论</td></tr>
</tbody></table></div>
<h3>4.7 一阶逻辑建模示例</h3>
<ul><li>“所有学生都聪明”：∀x Student(x)⇒Smart(x)</li><li>“存在聪明的学生”：∃x Student(x)∧Smart(x)</li><li>“x 是 y 的父亲”：father(x,y)（二元谓词）</li><li>“任何人的母亲是女性”：∀x Female(Mother(x))——Mother 是函词，Mother(x) 仍是个体。</li><li>教材经典：兄弟是“有共同父母的男性”：∀x∀y Brother(x,y) ⇔ Male(x) ∧ x≠y ∧ ∃p (Parent(p,x) ∧ Parent(p,y))</li></ul>
</div></div>
<div class=&quot;module-card&quot; id=&quot;section-6&quot;><div class=&quot;module-header&quot; onclick=&quot;toggleModule(this)&quot;><h2><span class=&quot;module-num&quot;>6</span>模块五：一阶逻辑推理（9.1-9.4）</h2><span class=&quot;module-toggle&quot;>▼</span></div><div class=&quot;module-body&quot;>
<h3>6.1 全称例化与存在例化</h3>
<p><span class=&quot;def-term&quot;>【全称例化（UI）】</span>对 ∀x α，可用任意基项 g 置换 x，推出 SUBST({x/g}, α)。例：由 ∀x King(x)∧Greedy(x)⇒Evil(x) 可推出 King(John)∧Greedy(John)⇒Evil(John)。</p>
<p><span class=&quot;def-term&quot;>【存在例化（EI）】</span>对 ∃x α，用一个<b>全新的常量符号 k</b>（Skolem常元）置换 x，推出 SUBST({x/k}, α)。k 不能在知识库中出现过——它只是一个“名字”，用来指代那个存在但未知的对象。</p>
<h3>6.2 合一与最一般合一置换（MGU）</h3>
<p><span class=&quot;def-term&quot;>【合一（Unify）】</span>寻找置换 θ 使两个原子语句经置换后相同：UNIFY(p,q)=θ 当且仅当 SUBST(θ,p)=SUBST(θ,q)。</p>
<p><span class=&quot;def-term&quot;>【最一般合一置换（MGU）】</span>使两语句合一的所有置换中最“一般”（限制最少）的那个——只替换必须替换的。UNIFY 算法返回 MGU，可在线性时间内完成。</p>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>待合一语句</th><th>MGU（教材示例）</th></tr></thead><tbody>
<tr><td>Knows(John, x) 与 Knows(John, Jane)</td><td>{x/Jane}</td></tr>
<tr><td>Knows(John, x) 与 Knows(y, OJ)</td><td>{x/OJ, y/John}</td></tr>
<tr><td>Knows(John, x) 与 Knows(y, Mother(y))</td><td>{y/John, x/Mother(John)}</td></tr>
<tr><td>Knows(John, x) 与 Knows(x, OJ)</td><td>失败（变量x两边指代冲突，需先变量标准化）</td></tr>
</tbody></table></div>
<div class=&quot;quick-card&quot;><b>合一三要点：</b>
<ul><li>同名字符串必须先<b>变量标准化</b>（各子句变量重命名互不相同），避免 Knows(John,x) 与 Knows(x,OJ) 这种冲突；</li><li>常元只能与变量或相同常元合一；变量可与任意项合一（但需<b>出现检查</b>：x 不能与含 x 的项合一，如 x 与 f(x) 不可合一）；</li><li>MGU 是唯一（差变量重命名意义下）的。</li></ul></div>
<h3>6.3 广义假言推理（GMP）</h3>
<div class=&quot;formula-box&quot;>GMP：p₁′, p₂′, …, pₙ′, (p₁∧p₂∧…∧pₙ ⇒ q) ⊢ SUBST(θ, q)<br>前提：存在置换 θ 使对所有 i 有 SUBST(θ, pᵢ′) = SUBST(θ, pᵢ)</div>
<p>教材示例：King(John)、Greedy(John) 与 ∀x King(x)∧Greedy(x)⇒Evil(x)，取 θ={x/John}，推出 Evil(John)。GMP 是可靠的推理规则；对<b>确定子句</b>（每个蕴含恰有一个正文字）的前向链接是完备的数据驱动推理方式。</p>
<h3>6.4 前向链接与反向链接</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>对比</th><th>前向链接 Forward Chaining</th><th>反向链接 Backward Chaining</th></tr></thead><tbody>
<tr><td>驱动方式</td><td><b>数据驱动</b>：从已知事实出发，不断应用规则产生新事实，直到推出目标或无可推</td><td><b>目标驱动</b>：从待证目标出发，反向找能推出它的规则，把证明目标分解为子目标</td></tr>
<tr><td>适用场景</td><td>监控类问题，需要对所有结论作出反应</td><td>问答类问题，只关心特定结论（Prolog 的推理方式）</td></tr>
<tr><td>完备性</td><td>对确定子句完备</td><td>深度优先版本可能陷入无限循环（不完备）；有重复子目标缓存的版本可避免</td></tr>
<tr><td>效率</td><td>可能推出大量与目标无关的事实</td><td>只触碰与目标相关的事实</td></tr>
</tbody></table></div>
<div class=&quot;quick-card&quot;><b>前向链接的与或图画法：</b>事实节点（方形/圆形）在底层，规则把多个前提经“弧线”连到一个新事实；当某条弧线的全部前提都已知时，新事实加入。考试若要求“用前向链接证明”，画出与或图即可得分。</div>
</div></div>
<div class=&quot;module-card&quot; id=&quot;section-7&quot;><div class=&quot;module-header&quot; onclick=&quot;toggleModule(this)&quot;><h2><span class=&quot;module-num&quot;>7</span>模块六：归结反演 + 2024期末大题“小明很高兴”完整解答（9.5）</h2><span class=&quot;module-toggle&quot;>▼</span></div><div class=&quot;module-body&quot;>
<h3>7.1 归结反演基本思想</h3>
<p><span class=&quot;def-term&quot;>【归结反演（Resolution Refutation）】</span>利用归结原理的自动定理证明方法，属于反证法：欲证 KB ⊨ α，只需证 <b>KB ∧ ¬α 不可满足</b>。步骤：将 KB 与 ¬α 一起转为 CNF 子句集 → 对子句集反复应用归结规则 → 若推出<b>空子句 □</b>，说明子句集不可满足，从而 KB ⊨ α 得证。</p>

<h3>7.3 Skolem化三情形（按存在量词位置分类）</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>情形</th><th>模式</th><th>Skolem化结果</th><th>说明</th></tr></thead><tbody>
<tr><td>① ∃ 不在任何 ∀ 辖域内</td><td>∃x ∀y R(x,y)</td><td>∀y R(a, y)</td><td>用<b>Skolem常量</b> a 替换 x</td></tr>
<tr><td>② ∃ 在 ∀ 辖域内</td><td>∀x ∃y R(x,y)</td><td>∀x R(x, f(x))</td><td>用<b>Skolem函数</b> f(x) 替换 y（y 依赖 x）</td></tr>
<tr><td>③ ∃ 在多个 ∀ 辖域内</td><td>∀x∀y ∃z R(x,y,z)</td><td>∀x∀y R(x, y, f(x,y))</td><td>f 的自变量 = 外层所有全称变量</td></tr>
</tbody></table></div>
<p>口诀：<b>“存在跟着全称走，前面几个全称变量，Skolem函数就带几个参数；前面没有全称变量，就退化为常量。”</b></p>
<h3>7.4 ★ 2024期末考试大题：“求证小明很高兴”（完整标准解答）</h3>
<div class=&quot;exam-q&quot;>
<div class=&quot;q-title&quot;>【2024期末 · 第2题（5+10分）】已知：任何通过计算机考试并且获奖的人都很高兴；任何肯学习的人或者运气好的人都能通过任何考试；小明不肯学习但是运气好；任何运气好的人都能获奖。求证：小明很高兴。（此题与2017期末第三大题“Jame版”为同题换名，标准答案结构一致）</div>
<div class=&quot;q-answer&quot;>第（1）步 形式化（5分）。定义谓词：Pass(x) = x 能通过（计算机）考试；Win(x) = x 能获奖；Happy(x) = x 很高兴；Study(x) = x 肯学习；Lucky(x) = x 运气好。则：
F1: ∀x Pass(x) ∧ Win(x) ⇒ Happy(x)
F2: ∀x Study(x) ∨ Lucky(x) ⇒ Pass(x)　（“肯学习或运气好⇒能通过考试”）
F3: ¬Study(小明) ∧ Lucky(小明)
F4: ∀x Lucky(x) ⇒ Win(x)
结论 G: Happy(小明)

第（2）步 转CNF子句集（含结论的否定 ¬G = ¬Happy(小明)）：
① ¬Pass(x) ∨ ¬Win(x) ∨ Happy(x)　　（F1消蕴含）
② ¬Study(x) ∨ Pass(x)　　（F2消蕴含）
③ ¬Lucky(x) ∨ Pass(x)　　（F2 中 ∨ 分配出的另一支）
④ ¬Study(小明)　　（F3 与消解）
⑤ Lucky(小明)　　（F3 与消解）
⑥ ¬Lucky(x) ∨ Win(x)　　（F4消蕴含）
⑦ ¬Happy(小明)　　（结论的否定）

第（3）步 归结反演（10分，每条子句标注来源）：
⑧ = ⑤⑥归结：Win(小明)　　（Lucky 与 ¬Lucky 相消，θ={x/小明}）
⑨ = ③⑤归结：Pass(小明)　　（θ={x/小明}）
⑩ = ①⑨归结：¬Win(小明) ∨ Happy(小明)　　（Pass 与 ¬Pass 相消，θ={x/小明}）
⑪ = ⑧⑩归结：Happy(小明)　　（Win 与 ¬Win 相消）
⑫ = ⑦⑪归结：□ 空子句　　（Happy 与 ¬Happy 相消，矛盾）
由 KB ∧ ¬G 归结出空子句，故 KB ∧ ¬G 不可满足，所以 KB ⊨ G，即“小明很高兴”得证。∎

评分要点（据2017同题评分标准）：形式化每句1分共5分；子句集2分；归结链每步标注亲本子句，得出空子句得全分；仅写“显然成立”或缺少归结步骤不给过程分。</div>

<div class=&quot;quick-card&quot;><b>归结反演大题通用答题模板（背下来直接套）：</b>
<ul><li>① 定义谓词并形式化：把每句自然语言写成 ∀x P(x)⇒Q(x) 形式（∀配⇒，∃配∧）；</li><li>② 写出结论 G 并取反：¬G 加入知识库；</li><li>③ 全部转 CNF 子句集，编号 ①②③…（写明每句由哪条公理变来）；</li><li>④ 归结：每一步写“新子句 = 亲本编号+亲本编号，θ={…}”，互补文字相消；</li><li>⑤ 推出 □ 即矛盾，下结论“原命题得证”。</li></ul></div>

<div class=&quot;module-card&quot; id=&quot;section-8&quot;><div class=&quot;module-header&quot; onclick=&quot;toggleModule(this)&quot;><h2><span class=&quot;module-num&quot;>8</span>模块七：历年真题考点归类（2015-2024共12题）</h2><span class=&quot;module-toggle&quot;>▼</span></div><div class=&quot;module-body&quot;>
<h3>考点A：命题逻辑形式化 + 真值/推理（约4题）</h3>
<div class=&quot;exam-q&quot;>
<div class=&quot;q-title&quot;>【2017期中 · 第4题（25分）】五嫌疑者宝石失窃：A说“是B或C偷的”；B说“我没偷”；C说“D也没偷”；D说“是E偷的”；E说“是C偷的”。已知每人供词<b>恰好一句为真</b>（供词含复合语句的按整体计）。问：谁偷了宝石？（要求形式化推理）</div>
<div class=&quot;q-answer&quot;>设偷宝石者为 T∈{A,B,C,D,E}（唯一）。逐假设真值排除：
若 T=A：B说“我没偷”真，C说“D也没偷”真，D说“是E偷的”假，E说“是C偷的”假，A说“B或C偷的”假——B、C两人供词皆真，与“恰好一人说真话”矛盾（题意等价于恰一人真话，详见评分标准）；继续检验 T=B、T=D、T=E 均使真供词数≠1；仅 T=C 时：A“是B或C”真，B“我没偷”真？——B真则两真……按官方标准答案：令⑥¬C 为假设，则由各人供词逐条推出 ⑦E→⑧B→⑨¬B 矛盾，故 C 偷了宝石（反证法）。结论：宝石是 C 偷的。
方法要点：把每句供词写成命题（如 SA: B∨C，SB: ¬B …），“恰好一真”给出约束，用真值表枚举或反证排除即可。这类题关键是先形式化再系统排除，切忌凭直觉。</div>
</div>
<div class=&quot;exam-q&quot;>
<div class=&quot;q-title&quot;>【2018期中 · 第四题】命题逻辑化简：把 ¬(P∧Q)⇒(¬P∨R) 化为 CNF，并判断是否为永真式。</div>
<div class=&quot;q-answer&quot;>消蕴含：¬(¬(P∧Q))∨(¬P∨R) = (P∧Q)∨(¬P∨R)；分配：(P∨¬P∨R)∧(Q∨¬P∨R)。P∨¬P 永真，故第一子句恒真；第二子句 Q∨¬P∨R 并非永真（P=T,Q=F,R=F 时为假），故原式可满足但非永真式。判永真的正规方法：证其否定不可满足（归结出□），或直接检查每个子句是否含互补文字。</div>
</div>
<h3>考点B：一阶逻辑形式化 + CNF 转换（约4题）</h3>
<div class=&quot;exam-q&quot;>
<div class=&quot;q-title&quot;>【2019期中 · 第五题(a)】把 (∀a p(a)) ⇒ (∃a{∀b[q(a,b)⇒p(a,b)]}) 化为 CNF（写出每一步）。</div>
<div class=&quot;q-answer&quot;>①消蕴含：¬(∀a p(a)) ∨ (∃a∀b[¬q(a,b)∨p(a,b)])
②量词否定内移：∃a ¬p(a) ∨ ∃a∀b[¬q(a,b)∨p(a,b)]
③变量标准化（两个 ∃a 重名）：∃x ¬p(x) ∨ ∃y∀z[¬q(y,z)∨p(y,z)]
④Skolem化：¬p(c₁) ∨ ∀z[¬q(c₂,z)∨p(c₂,z)]
⑤删全称量词、化为子句的合取（注意 ∨ 的合取式需分配）：最终子句集形如 (¬p(c₁)∨¬q(c₂,z)) ∧ (¬p(c₁)∨p(c₂,z))。
评分要点：量词否定内移时 ∀∃ 互换（1分）、两个存在量词必须用<b>不同</b>的Skolem常量（2分），这是最易丢分处。</div>
</div>
<div class=&quot;exam-q&quot;>
<div class=&quot;q-title&quot;>【2018期中 · 第四题(逻辑部分)】把“所有红头发的人要么是素食者，要么爱跑步；存在一个红头发的人不是素食者”形式化并转CNF。</div>
<div class=&quot;q-answer&quot;>形式化：∀x RedHair(x)⇒(Veg(x)∨Run(x))；∃x RedHair(x)∧¬Veg(x)。
CNF：子句1 ¬RedHair(x)∨Veg(x)∨Run(x)；子句2 RedHair(a)；子句3 ¬Veg(a)（a 为 Skolem 常量）。若题目要求证“存在爱跑步的人”：加 ¬Run(x) 后归结 2+1 得 Veg(a)∨Run(a)，再与 3 归结得 Run(a)，与 ¬Run(a) 归结得 □，得证。</div>
</div>
<h3>考点C：归结反演证明大题（约4题，分值最高的题型）</h3>
<div class=&quot;exam-q&quot;>
<div class=&quot;q-title&quot;>【2019期末 · 第二题（15分）】海豚识字：已知“任何会写字的动物都识字（∀x W(x)⇒K(x)）”且“海豚 z 会写字（W(z)）”。求证：海豚 z 识字 K(z)。要求用归结反演，画出归结树。</div>
<div class=&quot;q-answer&quot;>子句集：① ¬W(x)∨K(x)；② W(z)；③ ¬K(z)（结论否定）。
归结：④ = ①② 归结，θ={x/z}：K(z)；⑤ = ③④ 归结：□。得证。

<div class=&quot;q-title&quot;>【2019期中 · 第五题(b)(c)（共约15分)】城市道路网：(b) 用 Link(a,b)、Permit(a,b)、arrive(a,b) 等谓词写出三条公理——“有路相连且有通行证才能到达”等；(c) 对图三所示路网，用归结证明 arrive(a,b)，写出七步归结过程。</div>

<div class=&quot;q-title&quot;>【2018期中 · 第五题 / 2020期中 · 第三题】赵钱孙三人派遣出国：已知“赵钱孙至少派一人”P(zhao)∨P(qian)∨P(sun)；“若不派赵，则钱孙至少派一人”¬P(zhao)∨P(qian)∨P(sun)；“若不派钱，则必派孙”¬P(qian)∨P(sun)。用归结证明：必派孙 P(sun)。</div>
<div class=&quot;q-answer&quot;>子句集：① P(zhao)∨P(qian)∨P(sun)；② ¬P(zhao)∨P(qian)∨P(sun)；③ ¬P(qian)∨P(sun)；④ ¬P(sun)（结论否定）。
归结：⑤ = ③④：¬P(qian)；⑥ = ②④：¬P(zhao)∨P(qian)；⑦ = ⑤⑥：¬P(zhao)；⑧ = ①④：P(zhao)∨P(qian)；⑨ = ⑤⑧：P(zhao)；⑩ = ⑦⑨：□。故必派孙。∎
技巧：命题逻辑的归结大题先对结论取反得到单元子句，再用它逐个“削掉”原子句里的文字，是标准套路。</div>
</div>
<div class=&quot;exam-q&quot;>
<div class=&quot;q-title&quot;>【2024期末 · 第2题 / 2017期末 · 第三题（5+10分/20分）】“小明（Jame）很高兴”——见模块七（本卷最重要的一题，形式化+CNF+归结反演全流程）。</div>
<div class=&quot;q-answer&quot;>完整解答见上方模块七：子句集①-⑦，归结链⑧-⑫，最终 □。2017版评分标准：形式化5分（每句1分），子句集2分，归结13分（每步标注亲本子句）。</div>
</div>
<h3>考点D：FOL综合（公理系统/谁说谎）（约2题）</h3>
<div class=&quot;exam-q&quot;>
<div class=&quot;q-title&quot;>【2020期末A卷 · 第二题（20分）】谁说谎：A、B、C三人中有人从不说真话，也有人从不说假话。问“谁是说谎者”，A答：“B和C都是说谎者”；B答：“A和C都是说谎者”；C答：“A和B中至少有一个是说谎者”。求谁是老实人，谁是说谎者？（用命题逻辑形式化+归结）</div>
<div class=&quot;q-answer&quot;>设 T(X) 表“X说真话”（老实人）。三人的话按“说真话⇒内容真；说假话⇒内容假”形式化为六条蕴含：
T(A)⇒¬T(B)∧¬T(C)；¬T(A)⇒T(B)∨T(C)
T(B)⇒¬T(A)∧¬T(C)；¬T(B)⇒T(A)∨T(C)
T(C)⇒¬T(A)∨¬T(B)；¬T(C)⇒T(A)∧T(B)
消蕴含并分配（用A,B,C简记T(A),T(B),T(C)），去重后得子句集：
① ¬A∨¬B　② ¬A∨¬C　③ A∨B∨C　④ ¬B∨¬C　⑤ ¬A∨¬B∨¬C　⑥ A∨C　⑦ B∨C
（评分标准：形式化5分 + 子句集5分 + 消解10分）
归结证明“C是老实人”——加入结论否定 ¬C：
⑧ = ⑥与¬C 归结：A
⑨ = ⑦与¬C 归结：B
⑩ = ⑧与① 归结：¬B
⑪ = ⑨与⑩ 归结：□ 空子句，矛盾
故假设不成立，C说真话。代回验证：A说“B和C都说谎”为假（C是老实人）→ A说谎 ✓；B说“A和C都说谎”为假 → B说谎 ✓；C说“A和B中至少一个说谎”为真 → C老实 ✓。
结论：<b>C是老实人，A和B是说谎者</b>。</div>
</div>
<div class=&quot;exam-q&quot;>
<div class=&quot;q-title&quot;>【2018期末 · 第三题（20分）】亲属关系公理系统：给定 Parent、Male、Female 等谓词与若干事实，(a) 用一阶逻辑定义 Father、Mother、Grandparent、Sibling 等；(b) 用前向链接或归结回答查询。</div>
<div class=&quot;q-answer&quot;>定义模板：Father(x,y) ⇔ Parent(x,y)∧Male(x)；Mother(x,y) ⇔ Parent(x,y)∧Female(x)；Grandparent(x,z) ⇔ ∃y Parent(x,y)∧Parent(y,z)；Sibling(x,y) ⇔ x≠y ∧ ∃p Parent(p,x)∧Parent(p,y)。
注意：Sibling 定义中 x≠y 不能漏（否则自己是自己的兄弟）；Grandparent 的存在量词在 ⇔ 右侧，转CNF时若整句否定内移会变全称，需小心。这类“定义族谱谓词”题只要把每个亲属词按直觉写成 ∃/∀ 组合即可得分。</div>
</div>

<div class=&quot;module-card&quot; id=&quot;section-9&quot;><div class=&quot;module-header&quot; onclick=&quot;toggleModule(this)&quot;><h2><span class=&quot;module-num&quot;>9</span>模块八：易混淆概念辨析（8组）</h2><span class=&quot;module-toggle&quot;>▼</span></div><div class=&quot;module-body&quot;>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>#</th><th>概念对</th><th>关键区别</th></tr></thead><tbody>
<tr><td>1</td><td><b>⊨ 蕴含 vs ⊢ 推导</b></td><td>⊨ 是语义关系（所有模型中真值跟随）；⊢ 是语法推演（推理算法能推出）。可靠性=⊢⇒⊨；完备性=⊨⇒⊢。方向记反是名词解释题常见扣分点。</td></tr>
<tr><td>2</td><td><b>可靠性 vs 完备性</b></td><td>可靠性“推出的都是对的”（不撒谎）；完备性“对的都能推出”（不遗漏）。</td></tr>
<tr><td>3</td><td><b>有效 vs 可满足 vs 不可满足</b></td><td>所有模型真=永真；存在模型真=可满足；无模型真=不可满足。α永真⟺¬α不可满足。</td></tr>
<tr><td>4</td><td><b>谓词 vs 函词</b></td><td>谓词：个体域→{T,F}，代入常量得命题；函词：个体域→个体域，代入常量仍是个体。Mother(x)是函词、Loves(x,y)是谓词。</td></tr>
<tr><td>5</td><td><b>∀配⇒ vs ∃配∧</b></td><td>∀x P(x)⇒Q(x)（限制论域内才断言Q）；∃x P(x)∧Q(x)（确有一个兼具P和Q）。用反必错：∀配∧ 会把万物拉进P；∃配⇒ 只要有一个非P就为真。</td></tr>
<tr><td>6</td><td><b>∀x∃y vs ∃y∀x</b></td><td>前者 y 可随 x 变化（“每人都有自己的爱人”）；后者同一个 y 服务所有 x（“存在万人迷”）。混合量词不可交换。</td></tr>
<tr><td>7</td><td><b>前向链接 vs 反向链接</b></td><td>前向：数据驱动、事实→规则→新事实（监控型）；反向：目标驱动、目标→子目标（问答型，<div class=&quot;v4-block&quot;><strong>第4版 §9.4 扩充：等式推理与内置公理（Equality and Built-in Axioms）</strong><br>
第4版明确补充了等式符号 = 的专用推理规则：<br>
① <strong>等式替换（Substitution of Equals）</strong>：若 t₁ = t₂，可将公式中 t₁ 替换为 t₂<br>
② <strong>内置谓词</strong>：算术（&amp;lt;、+、×）、集合（∈）可内置公理化<br>
③ <strong>SLD归结</strong>：Prolog 使用的单一正文字归结 + 深度优先 → 完备但不健全（左递归会死循环）<br>
第3版对此节较简略，第4版结合实际逻辑编程语言做了具体对比。
</div>
Prolog）。</td></tr>
<tr><td>8</td><td><b>Skolem常量 vs Skolem函数</b></td><td>∃ 前无 ∀ → 常量（∃x R(x) → R(a)）；∃ 前有 n 个 ∀ → 带 n 个参数的函数（∀x∃y R → R(x,f(x))）。参数个数=外层全称变量数。</td></tr>
</tbody></table></div>
</div></div>
<div class=&quot;module-card&quot; id=&quot;section-10&quot;><div class=&quot;module-header&quot; onclick=&quot;toggleModule(this)&quot;><h2><span class=&quot;module-num&quot;>10</span>模块九：考前一页速记清单</h2><span class=&quot;module-toggle&quot;>▼</span></div><div class=&quot;module-body&quot;>
<h3>必背定义（名词解释押题）</h3>
<ul><li><b>知识库KB</b>：一种形式语言的语句集合；公理=预先给定而非推导的语句；Tell/Ask 是其两个基本操作。</li><li><b>蕴含 α⊨β</b>：使 α 为真的每个模型中 β 也为真，即 M(α)⊆M(β)。</li><li><b>可靠性</b>：KB⊢α ⇒ KB⊨α（推出的都对）；<b>完备性</b>：KB⊨α ⇒ KB⊢α（对的都能推出）。</li><li><b>合一</b>：找置换θ使两原子语句相同；<b>MGU</b>：最一般的合一置换。</li><li><b>归结反演</b>：证KB⊨α ⟺ 证KB∧¬α不可满足，对CNF子句集归结出空子句□。</li></ul>
<h3>必背公式与规则</h3>
<ul><li>α⇒β ≡ ¬α∨β；α⇔β ≡ (α⇒β)∧(β⇒α)；¬(α∧β)≡¬α∨¬β；¬(α∨β)≡¬α∧¬β</li><li>¬∀x p ≡ ∃x ¬p；¬∃x p ≡ ∀x ¬p</li><li>连接词优先级：¬ > ∧ > ∨ > ⇒ > ⇔</li><li>P⇒Q 仅当 P真Q假 时为假</li><li>归结：α∨β，¬β∨γ ⊢ α∨γ</li><li>GMP：p₁′…pₙ′ 与 p₁∧…∧pₙ⇒q，若 SUBST(θ,pᵢ′)=SUBST(θ,pᵢ)，则推出 SUBST(θ,q)</li></ul>
<h3>CNF 七步口诀</h3>
<div class=&quot;formula-box&quot;>消等价 → 消蕴含 → 否内移 → 变量标准化 → Skolem化 → 删全称 → 分配成子句</div>
<h3>答题模板（15-25分大题）</h3>
<ul><li>① 设谓词（写清每个谓词含义）→ ② 逐句形式化（∀配⇒，∃配∧）→ ③ 写结论并取反 → ④ 全部转CNF编号 → ⑤ 逐步归结（标亲本+θ）→ ⑥ 得□下结论。</li><li>真假话题：设 T(X)，把每人的话写成 T(X)⇔内容，转子句集，反证或枚举。</li></ul>
<div class=&quot;quick-card&quot;><b>临场提醒：</b>
<ul><li>归结每一步都要写 θ={x/常量}，漏写合一置换会扣过程分；</li><li>结论的否定必须加入子句集，且通常是单元子句，是归结的“导火索”；</li><li>Skolem化检查：∃前面有几个∀就带几个参数；两个∃必须用不同Skolem符号；</li><li>画归结树时根节点是□，每个内部节点标注两个亲本子句编号。</li></ul></div>
</div></div>
</div>

#fallback h3 { margin:14px 0 6px; font-size:14px; }

/* 核心逻辑推导链（可折叠，默认收缩在底部） */
.logic-section{background:#fff;border-radius:12px;padding:14px 16px;margin:12px 12px 0;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.logic-section h3{font-size:15px;color:#2e5c8a;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #e8f1fb;cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center;}
.lg-arrow{font-size:12px;transition:transform .3s;color:#6b7280;flex-shrink:0;margin-left:8px;}
.logic-section.collapsed > *:not(h3){display:none !important;}
.logic-section.collapsed h3{border-bottom:none !important;padding-bottom:0 !important;margin-bottom:0 !important;}
.logic-section.collapsed .lg-arrow{transform:rotate(-90deg);}
.logic-chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px;font-size:13px;}
.logic-chain .step{background:#e8f1fb;color:#2e5c8a;padding:5px 10px;border-radius:6px;font-weight:600;}
.logic-chain .arrow{color:#6b7280;font-size:14px;}
.logic-chain .result{background:#e7f6ec;color:#237a3a;padding:5px 10px;border-radius:6px;font-weight:700;}

/* 推导链底栏化：收缩时固定底部一行，导图区域占满剩余空间 */
html,body{height:100%;}
body{display:flex;flex-direction:column;box-sizing:border-box;padding-bottom:52px;}
body>.main{flex:1;display:flex;flex-direction:column;min-height:0;}
#chart{flex:1 1 auto !important;height:auto !important;min-height:280px !important;}
.logic-section{position:fixed;left:0;right:0;bottom:0;z-index:60;margin:0;border-radius:12px 12px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.14);max-height:48vh;overflow-y:auto;}

  b2:{t:'命题逻辑（第7章）', d:'以原子命题为最小单位的逻辑系统。考点密集区：五连接词优先级 ¬&gt;∧&gt;∨&gt;⇒&gt;⇔；真值表与逻辑等价；有效/可满足/不可满足三性；六条推理规则（归结最重要）；CNF四步转换；DPLL三大改进与WalkSAT局部搜索。'},

  b4:{t:'一阶逻辑推理（第9章）', d:'大题出处：UI/EI例化 → 合一与MGU → GMP → 前向/反向链接 → 归结反演。归结反演七步转CNF是全套大题的骨架，2024期末“小明很高兴”15分题即此流程的完整演练。'}

var nodeInfo = {
  center:{t:'第七至九章 逻辑Agent', d:'三章递进链：<b>第7章</b>知识库+命题逻辑（Wumpus世界为试验场）→ <b>第8章</b>一阶逻辑升级表示力 → <b>第9章</b>合一与归结反演实现自动证明。考试大题几乎全部落在“形式化→CNF→归结反演”这条链上。点击各分支查看细节。'},
  kb_axiom:{t:'知识库KB与公理', d:'<b>知识库</b>：一种形式语言的语句集合，是Agent关于世界的全部知识。<b>公理</b>：预先给定的、而不是从其他语句推导出来的语句。注意KB存的是“语句”而非事实本身——语句是对世界的表示。'},
  tell_ask:{t:'Tell 与 Ask', d:'知识库的两个基本操作：<b>Tell</b>——向KB添加新语句（新感知、新知识）；<b>Ask</b>——查询某语句是否被KB蕴含。Agent主循环：感知→Tell→Ask决定行动→执行。'},
  kb_abilities:{t:'基于知识的Agent五项能力', d:'①表示状态与行动；②引入新的感知信息（Tell）；③更新世界的表示（维护一致性）；④推导世界的潜在属性；⑤推导正确的行为。'},
  syntax_semantics:{t:'语法、语义与模型', d:'<b>语法</b>：合法语句的书写规范；<b>语义</b>：语句在每个可能世界中的真值；<b>模型</b>：可能世界的数学抽象，命题逻辑中即对全部命题符号的一次真值指派，M(α)=使α为真的模型集合。'},
  entailment:{t:'逻辑蕴含 ⊨', d:'α ⊨ β：在使 α 为真的<b>每一个</b>模型中 β 也为真。判据：<b>α⊨β ⟺ M(α)⊆M(β)</b>。形象记忆：蕴含如干草堆中的一根针，推理的目的就是找到这根针。'},
  sound_complete:{t:'可靠性 vs 完备性', d:'<b>可靠性</b>（Soundness）：KB⊢α ⇒ KB⊨α，推出的都是对的（不撒谎）；<b>完备性</b>（Completeness）：KB⊨α ⇒ KB⊢α，对的都能推出（不遗漏）。归结反演是可靠且（反驳）完备的。'},
  wumpus_rules:{t:'Wumpus世界规则', d:'4×4洞穴：无底洞相邻格有<b>微风</b>，Wumpus相邻格有<b>恶臭</b>，金块所在格<b>闪光</b>，另有碰撞与惨叫。感知向量=[Stench,Breeze,Glitter,Bump,Scream]。目标：找到金块并安全返回。'},
  wumpus_symbol:{t:'命题符号化', d:'Pᵢ,ⱼ表[i,j]有洞，Bᵢ,ⱼ表[i,j]有微风，W/S同理。核心规则每格一条双条件：<b>B₁,₁⇔(P₁,₂∨P₂,₁)</b>。初始事实¬P₁,₁、¬W₁,₁。'},
  wumpus_infer:{t:'感知→推理示例', d:'[1,1]无微风→Tell(¬B₁,₁)→结合B₁,₁⇔(P₁,₂∨P₂,₁)推出¬P₁,₂∧¬P₂,₁，故[1,2][2,1]安全标OK。这条“规则+感知⇒安全格”正是CNF与归结的素材。'},
  connectives:{t:'五个连接词与优先级', d:'¬非、∧与、∨或、⇒蕴含、⇔等价。优先级<b>¬ &gt; ∧ &gt; ∨ &gt; ⇒ &gt; ⇔</b>（从紧到松）。原子语句=单个命题词；复合语句=原子语句+连接词。'},
  truth_table:{t:'真值表语义', d:'n个命题符号共2ⁿ个模型。重点：<b>P⇒Q 仅当P真Q假时为假</b>（前件假则蕴含式空虚真）。真值表枚举是最朴素的模型检查法，但随符号数指数爆炸。'},
  logic_equiv:{t:'逻辑等价', d:'α≡β ⟺ 二者在同样的模型集中为真 ⟺ α⊨β且β⊨α。必背：蕴含消去(α⇒β)≡(¬α∨β)；等价消去(α⇔β)≡(α⇒β)∧(β⇒α)；De Morgan；双重否定；分配律。'},
  sat_valid:{t:'有效/可满足/不可满足', d:'<b>有效（永真）</b>：所有模型为真，如P∨¬P；<b>可满足</b>：至少一个模型为真；<b>不可满足</b>：无模型为真，如P∧¬P。关键：α有效⟺¬α不可满足——归结反演的理论根基。'},
  infer_rules:{t:'推理规则六条', d:'①假言推理MP：α⇒β,α⊢β；②与消解AE：α∧β⊢α；③与导入；④双重否定消去；⑤单项归结：α∨β,¬β⊢α；⑥<b>归结：α∨β,¬β∨γ⊢α∨γ</b>（互补文字相消，其余析取）。'},
  cnf4:{t:'CNF转换四步（命题逻辑）', d:'①消⇔：α⇔β→(α⇒β)∧(β⇒α)；②消⇒：α⇒β→¬α∨β；③否定内移：De Morgan+双重否定；④∨对∧分配。例：B₁,₁⇔(P₁,₂∨P₂,₁)→(¬B₁,₁∨P₁,₂∨P₂,₁)∧(¬P₁,₂∨B₁,₁)∧(¬P₂,₁∨B₁,₁)。'},
  prop_resolution:{t:'命题归结原理', d:'归结规则要求输入为CNF子句集。归结反演：证KB⊨α ⟺ 证KB∧¬α不可满足——把KB与结论否定一起转CNF，反复归结，推出空子句□即矛盾得证。'},
  dpll:{t:'DPLL算法', d:'判断CNF可满足性的<b>完备</b>回溯搜索（深度优先）。三大改进：①及早终止（子句有一文字真即真，全假即假）；②纯符号启发式（只以正/负形式出现的符号直接赋真）；③单元子句启发式（仅剩一文字的子句必须赋真）。'},
  walksat:{t:'WalkSAT算法', d:'局部搜索求可满足性，<b>不完备</b>。每次选一个未满足子句，翻转其中一个符号：以某概率随机翻（随机游走跳出局部最优），或翻使未满足子句数最小的符号（贪心）。评估函数=最小化不满足子句数量。'},
  prop_limit:{t:'命题逻辑的局限', d:'原子命题不可再分解，无法表达局部与整体、一般与个别的关系（“所有人都会死”须逐人枚举，写不完）。一阶逻辑把原子命题细化为个体+谓词+量词。'},
  fol_elements:{t:'一阶逻辑基本元素', d:'世界=<b>对象+关系+函数</b>。常量符号（John、Hunan）指对象；谓词符号（Brother、Student）指关系；函词符号（Sqrt、LeftLegOf）指函数；另有变量、连接词、量词∀∃、等词=。'},
  pred_func:{t:'谓词 vs 函词', d:'<b>谓词</b>：个体域→{True,False}，代入常量得命题（Car(吉普车)可真可假）；<b>函词</b>：个体域→个体域，代入常量仍是个体（f(2)=12还是数）。Mother(x)是函词，Loves(x,y)是谓词。'},
  forall_q:{t:'全称量词 ∀', d:'“一切的、凡是的、所有的、每一个”。∀x P(x)=定义域中所有个体都具有性质P。例：∀x Student(x)⇒Smart(x) 所有学生都聪明。'},
  exists_q:{t:'存在量词 ∃', d:'“存在、有一个、某些”。∃x P(x)=定义域中至少一个个体具有性质P。例：∃x Student(x)∧Smart(x) 存在聪明的学生。'},
  quant_connect:{t:'量词搭配铁律', d:'<b>∀通常配⇒</b>：∀x Student(x)⇒Smart(x)（若误配∧则断言万物皆学生）；<b>∃通常配∧</b>：∃x Student(x)∧Smart(x)（若误配⇒则有一个非学生就为真）。改卷扣分重灾区。'},
  quant_order:{t:'量词顺序与否定', d:'同类可交换：∀x∀y≡∀y∀x，∃x∃y≡∃y∃x。<b>混合不可换</b>：∀x∃y Loves(x,y)=每人都有自己的爱人；∃y∀x Loves(x,y)=存在万人迷。否定穿过量词时互换：¬∀x p≡∃x ¬p；¬∃x p≡∀x ¬p。'},
  fol_model:{t:'建模示例', d:'“任何人的母亲是女性”：∀x Female(Mother(x))（Mother为函词）。兄弟定义：∀x∀y Brother(x,y)⇔Male(x)∧x≠y∧∃p(Parent(p,x)∧Parent(p,y))——注意x≠y不可漏。'},
  ui_rule:{t:'全称例化 UI', d:'∀x α ⊢ SUBST({x/g}, α)，g为任意基项。例：∀x King(x)∧Greedy(x)⇒Evil(x) 可例化出 King(John)∧Greedy(John)⇒Evil(John)。'},
  ei_rule:{t:'存在例化 EI', d:'∃x α ⊢ SUBST({x/k}, α)，k必须是<b>知识库中从未出现过的新常量</b>（Skolem常元）——它只是给那个“存在但未知”的对象起个名字，不得与已知对象混用。'},
  eg_ug:{t:'EG 与 UG', d:'<b>存在引入EG</b>：A(c)⊢∃x A(x)，由实例泛化出存在结论；<b>全称引入UG</b>：A(y)⊢∀x A(x)，要求y是任意个体（非特指），否则会犯以偏概全的错误。'},
  unify:{t:'合一 Unify', d:'UNIFY(p,q)=θ 当且仅当 SUBST(θ,p)=SUBST(θ,q)。要点：各子句先<b>变量标准化</b>（变量重名会假冲突，如Knows(John,x)与Knows(x,OJ)）；常元只能与变量或相同常元合一；需出现检查（x不能与含x的项合一）。'},
  mgu:{t:'最一般合一置换 MGU', d:'所有合一置换中限制最少的那个——只替换必须替换的。例：Knows(John,x)与Knows(y,OJ)的MGU为{x/OJ, y/John}。UNIFY算法返回MGU，可在线性时间完成；MGU在变量重命名意义下唯一。'},
  gmp:{t:'广义假言推理 GMP', d:'p₁′…pₙ′ 与 (p₁∧…∧pₙ⇒q)，若存在θ使 SUBST(θ,pᵢ′)=SUBST(θ,pᵢ) 对所有i成立，则推出 SUBST(θ,q)。例：King(John)、Greedy(John)+规则 ⇒ Evil(John)，θ={x/John}。对确定子句可靠且（前向链接下）完备。'},
  forward_chain:{t:'前向链接', d:'<b>数据驱动</b>：从已知事实出发反复应用规则产生新事实，直到推出目标或无可推。对确定子句完备；适合监控类问题；缺点是可能推出大量无关事实。与或图中当一条弧的全部前提已知时触发新事实。'},
  backward_chain:{t:'反向链接', d:'<b>目标驱动</b>：从待证目标反向找规则，把目标分解为子目标递归证明（Prolog的推理方式）。只触碰与目标相关的事实，适合问答类问题；深度优先版本可能死循环，需子目标缓存。'},
  cnf7:{t:'CNF转换七步法', d:'①消去等价词⇔；②消去蕴含词⇒；③否定内移（De Morgan+双重否定+量词否定互换）；④变量标准化；⑤Skolem化消∃；⑥略去全称量词；⑦分配律化为子句的合取。口诀：消等价→消蕴含→否内移→标准化→Skolem→删全称→分配。'},
  skolem:{t:'Skolem化三情形', d:'①∃前无∀：∃x∀y R(x,y)→∀y R(a,y)，用Skolem常量；②∃前有一个∀：∀x∃y R(x,y)→∀x R(x,f(x))；③∃前有n个∀：Skolem函数带n个参数，∀x∀y∃z R→R(x,y,f(x,y))。口诀：前面几个全称变量，函数就带几个参数。'},
  west_case:{t:'West导弹经典案例', d:'教材9.x推理示例：∀x American(x)∧Weapon(y)∧Sells(x,y,z)∧Hostile(z)⇒Criminal(x) 等规则+事实，用前向链接或归结证明 Criminal(West)。是GMP与链接推理的标志性例题。'},
  resolution_proof:{t:'归结反演', d:'证KB⊨α ⟺ 证KB∧¬α不可满足。流程：形式化→结论取反→全部转CNF子句集→反复归结（每步标亲本子句与θ）→推出空子句□即矛盾，原结论得证。可靠且反驳完备。'},
  exam2024:{t:'2024期末“小明很高兴”', d:'15分大题（与2017期末Jame题同题换名）。子句集：①¬Pass∨¬Win∨Happy ②¬Study∨Pass ③¬Lucky∨Pass ④¬Study(明) ⑤Lucky(明) ⑥¬Lucky∨Win ⑦¬Happy(明)。归结链：⑧=⑤⑥Win(明)，⑨=③⑤Pass(明)，⑩=①⑨¬Win∨Happy，⑪=⑧⑩Happy(明)，⑫=⑦⑪□。得证。'}
};
var genericInfo = {};
function buildTreeData() {
  var root = {name:'逻辑Agent\n（第7-9章）', short:'逻辑Agent', key:'center',
    itemStyle:{color:'#1a365d'}, label:{color:'#1a365d', fontWeight:'bold', fontSize:13},
    children:[]};
  BRANCH_META.forEach(function(b) {
    var bnode = {name:b.name, short:b.short, key:b.key,
      itemStyle:{color:b.color}, label:{color:b.color, fontWeight:'bold', fontSize:12},
      lineStyle:{color:b.color, width:2}, children:[]};
    b.children.forEach(function(l) {
      bnode.children.push({name:l.name, short:l.short, key:l.key,
        itemStyle:{color:'#ffffff', borderColor:b.color, borderWidth:2},
        label:{color:'#1a1b1c', fontSize:11},
        lineStyle:{color:b.color, width:1.2}});
    });
    root.children.push(bnode);
  });
  return root;
}
var treeData = buildTreeData();
var currentLayout = 'radial';
var chart = null;
function buildOption(layout) {
  var radial = (layout === 'radial');
  return {
    series:[{
      type:'tree', data:[treeData], layout: radial ? 'radial' : 'orthogonal',
      orient: radial ? undefined : 'LR',
      left:'10%', right:'24%', top:'12%', bottom:'12%',
      roam:true, initialTreeDepth:-1, expandAndCollapse:true,
      symbol:'circle', symbolSize:10,
      edgeShape: radial ? 'curve' : 'polyline',
      edgeForkPosition:'65%',
      label:{show:true, position: radial ? 'inside' : 'right', distance:6,
        formatter:function(p){ return p.data.short || p.data.name; }},
      leaves:{label:{position: radial ? 'radial' : 'right', formatter:function(p){ return p.data.short || p.data.name; }}},
      emphasis:{focus:'descendant'},
      animationDuration:300, animationDurationUpdate:300
    }]
  };
}
function clearCollapsed(node) {
  delete node.collapsed;
  if (node.children) node.children.forEach(clearCollapsed);
}
function expandAll() {
  if (!chart) return;
  clearCollapsed(treeData);
  chart.setOption(buildOption(currentLayout), true);
}
function collapseAll() {
  if (!chart) return;
  setCollapsedDeep(treeData, 1);
  chart.setOption(buildOption(currentLayout), true);
}
function tryInit() {
  var el = document.getElementById('chart');
  if (window.echartsFailed || typeof echarts === 'undefined') { showFallback(); return; }
  var timer = setInterval(function() {
    if (el.offsetWidth > 0 && el.offsetHeight > 0) {
      clearInterval(timer);
      chart = echarts.init(el);
      chart.setOption(buildOption(currentLayout));
      chart.on('click', function(p) {
        if (p.data && p.data.key) showInfo(p.data.key);
      });
      var _lastTouchKey = null;
      chart.on('mouseover', function(p) { if(p.data && p.data.key) _lastTouchKey = p.data.key; });
      var _chartDom2 = document.getElementById('chart');
      var _touchMoved2 = false;
      _chartDom2.addEventListener('touchstart', function(){ _touchMoved2 = false; }, {passive:true});
      _chartDom2.addEventListener('touchmove', function(){ _touchMoved2 = true; }, {passive:true});
      _chartDom2.addEventListener('touchend', function(){
        if (_touchMoved2) return;
        setTimeout(function(){
          var panel = document.getElementById('infoPanel');
          if (panel && !panel.classList.contains('show') && _lastTouchKey) showInfo(_lastTouchKey);
        }, 120);
      }, {passive:true});
      window.addEventListener('resize', function(){ if (chart) chart.resize(); });
    }
  }, 80);
}
function showFallback() {
  var fb = document.getElementById('fallback');
  var html = '<b>思维导图加载失败（无法访问CDN），以下是文字版结构：</b>';
  BRANCH_META.forEach(function(b) {
    html += '<h3 style=&quot;color:' + b.color + '&quot;>◆ ' + b.name + '</h3><ul>';
    b.children.forEach(function(l){ html += '<li>' + l.name + '</li>'; });
    html += '</ul>';
  });
  fb.innerHTML = html;
  fb.classList.add('show');
}
function toggleLayout() {
  if (!chart) return;
  currentLayout = (currentLayout === 'radial') ? 'orthogonal' : 'radial';
  chart.setOption(buildOption(currentLayout), true);
}
function resetView() {
  if (!chart) return;
  chart.setOption(buildOption(currentLayout), true);
}
function setCollapsedDeep(node, depth) {
  if (depth <= 0 && node.children) node.collapsed = true;
  if (node.children) node.children.forEach(function(c){ setCollapsedDeep(c, depth - 1); });
}
function showInfo(key) {
  var info = nodeInfo[key] || branchInfo[key] || genericInfo[key];
  if (!info) {
    var nm = key;
    BRANCH_META.forEach(function(b){
      if (b.key === key) nm = b.name;
      b.children.forEach(function(l){ if (l.key === key) nm = l.name; });
    });
    info = {t:nm, d:'该节点暂无详细说明，请查看复习笔记对应章节。'};
  }
  document.getElementById('ipTitle').textContent = info.t;
  document.getElementById('ipBody').innerHTML = info.d;
  document.getElementById('infoMask').classList.add('show');
  document.getElementById('info-panel').classList.add('show');
}
function closeInfo() {
  document.getElementById('infoMask').classList.remove('show');
  document.getElementById('info-panel').classList.remove('show');
}
function generateNodeNav() {
  var html = '<div class=&quot;nn-title&quot;>🧠 节点导航（点击定位）</div>';
  BRANCH_META.forEach(function(b) {
    html += '<div class=&quot;nn-branch&quot; style=&quot;color:' + b.color + '&quot;>◆ ' + b.name + '</div>';
    b.children.forEach(function(l) {
      html += '<a class=&quot;nn-item&quot; data-key=&quot;' + l.key + '&quot; onclick=&quot;navToNode(this.dataset.key)&quot;>' + l.name + '</a>';
    });
  });
  document.getElementById('node-nav').innerHTML = html;
}
function openNodeNav() {
  generateNodeNav();
  document.getElementById('node-nav').classList.add('show');
  document.getElementById('nav-mask').classList.add('show');
}
function closeNodeNav() {
  document.getElementById('node-nav').classList.remove('show');
  document.getElementById('nav-mask').classList.remove('show');
}
function navToNode(key) {
  closeNodeNav();
  if (chart) {
    setCollapsedDeep(treeData, 1);
    BRANCH_META.forEach(function(b, bi) {
      var hit = b.children.some(function(l){ return l.key === key; });
      if (hit || b.key === key) {
        var bnode = treeData.children[bi];
        if (bnode) bnode.collapsed = false;
      }
    });
    chart.setOption(buildOption(currentLayout), true);
  }
  setTimeout(function(){ showInfo(key); }, 350);
}
tryInit();
</script>
</body>
</html>

<script>
var currentTab = 'notes';
function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('panel-notes').classList.toggle('active', tab === 'notes');
  document.getElementById('panel-mindmap').classList.toggle('active', tab === 'mindmap');
  document.getElementById('expandBtn').textContent = '📂 展开';
}
function getWin() {
  var id = (currentTab === 'notes') ? 'frame-notes' : 'frame-mindmap';
  return document.getElementById(id).contentWindow;
}
function openNav() {
  var w = getWin();
  try {
    if (currentTab === 'notes') { w.openSidebar(); } else { w.openNodeNav(); }
  } catch(e) {}
}
var expanded = false;
function toggleExpand() {
  var w = getWin();
  try {
    if (expanded) { w.collapseAll(); } else { w.expandAll(); }
    expanded = !expanded;
    document.getElementById('expandBtn').textContent = expanded ? '📁 折叠' : '📂 展开';
  } catch(e) {}
}
</script>
