<div class=&quot;module-card&quot; id=&quot;section-1&quot;><div class=&quot;module-header&quot; onclick=&quot;toggleModule(this)&quot;><h2><span class=&quot;module-num&quot;>1</span>三章知识框架总览</h2><span class=&quot;module-toggle&quot;>▼</span></div><div class=&quot;module-body&quot;>
<p>第 13～15 章构成一条完整的<strong>不确定性推理</strong>主线：第 13 章提供概率语言与贝叶斯法则（地基），第 14 章用贝叶斯网络把指数级的联合分布压缩成可计算的紧凑表示（静态世界推理），第 15 章把贝叶斯网络沿时间轴展开，得到马尔可夫链与隐马尔可夫模型（动态世界推理）。<strong>第 15 章的全部符号体系（条件概率、条件独立、网络语义）都建立在第 13、14 章之上</strong>。</p>
<h3>三章定位与递进关系</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>章节</th><th>回答的核心问题</th><th>关键概念</th><th>典型考法</th></tr></thead><tbody>
<tr><td>第13章 不确定性的量化</td><td>Agent 如何表示与计算不确定性？</td><td>信念度、概率公理、条件概率、贝叶斯法则、朴素贝叶斯</td><td>全概率/贝叶斯计算、朴素贝叶斯分类</td></tr>
<tr><td>第14章 概率推理</td><td>如何紧凑表示并高效推理大规模概率分布？</td><td>贝叶斯网络、CPT、条件独立、D 分离、精确/近似推理</td><td>画网络、联合/条件概率计算、独立性判断（高频大题）</td></tr>
<tr><td>第15章 时间上的概率推理</td><td>状态随时间变化时如何递推信念？</td><td>马尔可夫假设、转移/传感器模型、HMM、滤波/预测/平滑</td><td>画 HMM、前向算法算序列概率、最可能隐藏状态（高频大题）</td></tr>
</tbody></table></div>
<h3>符号依赖链（三章递进）</h3>
<div class=&quot;formula&quot;>P(a|b)=P(a∧b)/P(b)（13章 条件概率）→ P(b|a)=P(a|b)P(b)/P(a)（13章 贝叶斯法则）→ P(x₁,…,xₙ)=Π P(xᵢ|Parents(Xᵢ))（14章 网络语义）→ P(Xₜ|X₀:ₜ₋₁)=P(Xₜ|Xₜ₋₁)（15章 马尔可夫假设）→ HMM：P(Eₜ|Xₜ)（15章 传感器模型）</div>
<p>要点：<strong>HMM 本质上是最简单的动态贝叶斯网络</strong>——把 14 章的网络结构按时间片复制展开，并附加马尔可夫假设与平稳性假设。复习时务必按 13→14→15 的顺序递进。</p>

</div></div><div class=&quot;module-card&quot; id=&quot;section-2&quot;><div class=&quot;module-header&quot; onclick=&quot;toggleModule(this)&quot;><h2><span class=&quot;module-num&quot;>2</span>第13章 不确定性的量化</h2><span class=&quot;module-toggle&quot;>▼</span></div><div class=&quot;module-body&quot;>
<h3>2.1 不确定环境下的行动（13.1）</h3>
<p>Agent 的环境可能是<strong>部分可观察</strong>的或<strong>不确定</strong>的，也可能两者兼有。逻辑 Agent 在解释观察到的部分信息时必须考虑每一种逻辑上可能的解释（信念状态），导致问题表示庞大而复杂。概率理论为 Agent 提供了一条更务实的出路。</p>
<p><span class=&quot;def-term&quot;>【信念度（degree of belief）】</span>Agent 拥有的知识不能保证实现其中任何一个目标，但可以提供它们在某种程度上将被实现的度量。概率 Agent 为每个语句赋予一个 0 到 1 之间的数值作为其信念度。</p>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>对比维度</th><th>逻辑 Agent</th><th>概率 Agent</th></tr></thead><tbody>
<tr><td>相同点</td><td colspan=&quot;2&quot;>都认为世界由成立或者不成立的事实组成</td></tr>
<tr><td>对语句的态度</td><td>相信每个语句是正确的或者错误的</td><td>为每个语句赋予 0～1 之间的数值作为信念度</td></tr>
<tr><td>断言方式</td><td>逻辑断言：排除所有断言不成立的世界</td><td>概率断言：考虑各种可能世界的可能性有多大</td></tr>
</tbody></table></div>
<p><span class=&quot;def-term&quot;>【效用理论（utility theory）】</span>Agent 会偏好效用（utility）更高的状态。</p>
<p><span class=&quot;def-term&quot;>【决策理论】</span>决策理论 = 概率理论 + 效用理论。</p>
<p><span class=&quot;def-term&quot;>【期望效用最大化（MEU）原则】</span>一个 Agent 是理性的，当且仅当它选择能产生最高期望效用的行动，称为期望效用最大化（期望即统计学的平均）。</p>
<h3>2.2 基本概率符号（13.2）</h3>
<p><span class=&quot;def-term&quot;>【样本空间 Ω】</span>概率理论中所有可能世界组成的集合，这些可能世界是<strong>互斥的、完备的</strong>。</p>
<p><span class=&quot;def-term&quot;>【可能世界 ω】</span>样本空间中的一个样本，即一个特定的可能世界。基本公理：每个可能世界具有一个 0 到 1 之间的概率，且样本空间中可能世界的总概率为 1。</p>
<div class=&quot;formula&quot;>★ 概率基本公理： Σ<sub>ω∈Ω</sub> P(ω) = 1</div>
<p><span class=&quot;def-term&quot;>【概率模型】</span>样本空间 Ω 为每一个可能世界附一个数值概率 P(ω)。<span class=&quot;def-term&quot;>【事件/命题】</span>样本空间中的可能世界集合：对任意命题 f，P(f) = Σ<sub>ω∈f</sub> P(ω)。</p>
<p><span class=&quot;def-term&quot;>【随机变量】</span>概率模型的基本元素，大写字母开头（如 Total：掷两个骰子的点数）；<strong>定义域</strong>是变量所有可能值组成的集合。约定：A=true 简写成 a，A=false 简写成 ¬a。</p>
<p><span class=&quot;def-term&quot;>【原子命题】</span>通过对随机变量赋值得到的命题，如 Weather = sunny、Cavity = false。<span class=&quot;def-term&quot;>【复杂命题】</span>原子命题通过连接符号连接而成，如 Weather = sunny ∨ Cavity = false。</p>
<p><span class=&quot;def-term&quot;>【概率分布】</span>为随机变量的所有可能取值赋予概率值，所有可能事件的概率值之和为 1。例：P(Weather = sunny)=0.6，P(rain)=0.1，P(cloudy)=0.29，P(snow)=0.01，可简写为 <strong>P</strong>(Weather) = ⟨0.6, 0.1, 0.29, 0.01⟩（黑体 P 表示整个分布）。</p>
<p><span class=&quot;def-term&quot;>【概率密度函数】</span>描述连续变量概率分布的函数：P(X=x) = lim<sub>dx→0</sub> P(x ≤ X ≤ x+dx)/dx。</p>
<p><span class=&quot;def-term&quot;>【先验概率（无条件概率）】</span>不知道其他任何信息的情况下对命题的信念度。<span class=&quot;def-term&quot;>【后验概率（条件概率）】</span>在已知证据条件下对命题的信念度，记 P(a|b)。</p>
<p><span class=&quot;def-term&quot;>【（完全）联合概率分布】</span>对多个随机变量中的每个变量发生的可能性进行概率赋值。<strong>使用完全联合概率分布作为「知识库」，从中可以导出所有问题的答案</strong>——这就是概率推理的基本思想。</p>
<h3>2.3 概率公理与推理规则（13.2～13.3）</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>名称</th><th>公式</th><th>说明</th></tr></thead><tbody>
<tr><td>柯尔莫哥洛夫公理</td><td>0≤P(ω)≤1；ΣP(ω)=1；P(f)=Σ<sub>ω∈f</sub>P(ω)</td><td>概率论的三大基石</td></tr>
<tr><td>包含-排斥原理</td><td>P(A∩B)+P(A∪B)=P(A)+P(B)</td><td>等价写法：P(a∨b)=P(a)+P(b)−P(a∧b)</td></tr>
<tr><td>条件概率定义</td><td>P(a|b) = P(a∧b)/P(b)，（P(b)&gt;0）</td><td>条件概率 = 联合 ÷ 证据</td></tr>
<tr><td>乘法规则</td><td>P(a∧b) = P(a|b)P(b) = P(b|a)P(a)</td><td>由条件概率定义移项即得</td></tr>
<tr><td>链式规则</td><td>P(x₁,…,xₙ) = P(xₙ|x₁…xₙ₋₁)·P(xₙ₋₁|x₁…xₙ₋₂)…P(x₁)</td><td>乘法规则的推广，14 章贝叶斯网络由此化简</td></tr>
<tr><td>全概率公式</td><td>P(b) = Σᵢ P(b|aᵢ)P(aᵢ)</td><td>{aᵢ} 为样本空间的一个划分；边缘化由此而来</td></tr>
</tbody></table></div>
<p><span class=&quot;def-term&quot;>【独立性（边缘/绝对独立）】</span>命题 a 和 b 相互独立，记 a⊥b，三种等价形式：</p>
<div class=&quot;formula&quot;>P(a|b)=P(a) ⇔ P(b|a)=P(b) ⇔ P(a∧b)=P(a)P(b)</div>
<p><span class=&quot;def-term&quot;>【条件独立性】</span>给定 Z，X 是 Y 的条件独立，记 X⊥Y|Z，当且仅当：</p>
<div class=&quot;formula&quot;>∀x,y,z： P(x,y|z)=P(x|z)P(y|z) ⇔ P(x|y,z)=P(x|z)</div>

<p><strong>为什么条件独立极其重要：</strong>绝对独立在现实中非常罕见，而条件独立是我们关于不确定环境的知识最基本、最鲁棒的形式。利用条件独立性能够把完全联合分布所需的概率数目<strong>从指数级降到接近线性级</strong>（如牙医问题中 Weather 独立于 Toothache/Catch/Cavity）。这正是第 14 章贝叶斯网络可行化的理论根源。</p>
<h3>2.4 贝叶斯法则与朴素贝叶斯（13.4～13.5）</h3>
<p><span class=&quot;def-term&quot;>【贝叶斯规则（Bayes rule）】</span>由乘法规则两种写法相等 P(a|b)P(b)=P(b|a)P(a) 直接推出：</p>
<div class=&quot;formula&quot;>P(b|a) = P(a|b)·P(b) / P(a)</div>
<p><strong>诊断方向的应用</strong>：把未知因素 cause 造成的结果 effect 看作证据，反推原因：</p>
<div class=&quot;formula&quot;>P(Cause|effect) = P(effect|Cause)·P(Cause) / P(effect)</div>
<p>教材经典例（脑膜炎与脖子僵硬）：P(s|m)=0.7，P(m)=1/50000，P(s)=0.01，则 P(m|s)=0.7×(1/50000)/0.01 = 0.0014——即使症状高度提示，先验极低时后验仍小。<strong>先验概率不能丢！</strong></p>
<p><span class=&quot;def-term&quot;>【归一化常数 α】</span>分母 P(effect) 可通过全概率展开或直接归一化求得：P(Cause|e) = α·P(e|Cause)P(Cause)，其中 α = 1/P(e)，使各取值概率之和为 1。考试时不必算分母，先算分子再归一化是最快的标准流程。</p>
<p><span class=&quot;def-term&quot;>【朴素贝叶斯（naive Bayes）】</span>假设所有结果 Effectᵢ 在给定原因 Cause 时<strong>相互条件独立</strong>，于是：</p>
<div class=&quot;formula&quot;>P(Cause, Effect₁, …, Effectₙ) = P(Cause) · Πᵢ P(Effectᵢ|Cause)</div>
<p>朴素贝叶斯把联合分布的参数规模从 2ⁿ 降到 O(n)，是文本分类等任务的常用基线模型，也是历年卷中「样例学习」大题的常客（见模块六真题）。</p>

<h3>3.1 贝叶斯网络的定义与要素（14.1）</h3>
<p><span class=&quot;def-term&quot;>【贝叶斯网络（Bayesian network）】</span>一种简单的、用于表示变量之间条件独立关系的<strong>有向无环图（DAG）</strong>。又称信度网、概率网络、因果网络、知识图。</p>
<ul>
<li><strong>结点</strong>：对应于随机变量；</li>
<li><strong>有向边</strong>：连接结点对，表示直接的依赖（因果）关系；</li>
<li><strong>每个结点都有一个条件概率分布</strong> P(Xᵢ|Parents(Xᵢ))，量化父结点对其影响。</li>
</ul>
<p><span class=&quot;def-term&quot;>【条件概率表（CPT）】</span>离散结点中列出给定父结点每种组合时子结点各取值的概率表。</p>
<p><span class=&quot;def-term&quot;>【确定性结点】</span>子结点由父结点完全决定，没有任何不确定性。<span class=&quot;def-term&quot;>【不确定性结点】</span>子结点与父结点的因果关系不确定，存在概率表示。</p>
<p><span class=&quot;def-term&quot;>【单联通网络（多树 polytree）】</span>任意两个结点之间顶多只有一条无向路径——<strong>精确推理的时间和空间复杂度与网络规模呈线性关系</strong>。<span class=&quot;def-term&quot;>【多联通网络】</span>非单联通的网络，精确推理最坏情况指数级（NP 难）。</p>
<h3>3.2 贝叶斯网络的语义（14.2）</h3>
<p>网络语义由两条等价途径给出：</p>
<ul>
<li><strong>数值语义</strong>：完全联合分布 = 各结点条件概率的乘积（链式规则 + 条件独立化简）：</li>
</ul>
<div class=&quot;formula&quot;>P(x₁,…,xₙ) = Πᵢ P(xᵢ | Parents(Xᵢ))</div>
<ul>
<li><strong>结构语义</strong>：给定父结点后，每个结点与其<strong>非后代结点</strong>条件独立（局部马尔可夫性）。</li>
</ul>
<p>对照链式规则 P(x₁,…,xₙ)=ΠP(xᵢ|xᵢ₋₁…x₁)：贝叶斯网络只是把每个变量的条件集从「所有前驱」压缩为「它的父结点」，条件独立关系正是被删去的那些直接依赖。</p>

<h3>3.3 贝叶斯网络的构建</h3>
<ul>
<li><strong>方向原则：由原因指向结果</strong>（先画原因结点，再画受其直接影响的结果结点）；</li>
<li>按拓扑顺序逐个添加结点，为每个结点填写 CPT；</li>
<li>好的因果方向能使网络更稀疏、CPT 更小、参数更易评估（因果模型的参数通常更符合专家直觉）；</li>
<li>变量之间的独立性和条件独立性可以大大减少完全联合概率分布所需要的概率数目。</li>
</ul>

<p><strong>记忆口诀</strong>：同父链式「观测则断」，V 型「观测则通」——判断题先找路径，再逐条检查碰撞结点。</p>
</div></div><div class=&quot;module-card&quot; id=&quot;section-4&quot;><div class=&quot;module-header&quot; onclick=&quot;toggleModule(this)&quot;><h2><span class=&quot;module-num&quot;>4</span>第14章（下）贝叶斯网络中的推理</h2><span class=&quot;module-toggle&quot;>▼</span></div><div class=&quot;module-body&quot;>
<h3>4.1 推理任务与变量角色</h3>
<p>贝叶斯网络中的推理（概率推理）：<strong>根据已观察到的证据计算查询命题的后验概率</strong>。三类变量角色：</p>
<ul>
<li><strong>查询变量 X</strong>：想要求后验分布的变量；</li>
<li><strong>证据变量 E</strong>：已观测到取值的变量（e）；</li>
<li><strong>隐变量 Y</strong>：既非查询也非证据、需要被求和消去的变量。</li>
</ul>
<p>按信息流向可分为：<strong>因果推理</strong>（自顶向下，由因推果）、<strong>诊断推理</strong>（自底向上，由果推因，贝叶斯法则的典型用法）、以及二者的混合。</p>
<h3>4.2 精确推理——枚举法（14.4）</h3>
<div class=&quot;formula&quot;>P(X|e) = α·P(X,e) = α·Σ<sub>y</sub> P(X, e, y)</div>
<p>即：对联合分布中所有隐变量的取值求和（边缘化），联合概率项按网络语义 Π P(xᵢ|Parents) 展开计算，最后归一化。以报警网为例：P(B|j,m)=αΣ<sub>e</sub>Σ<sub>a</sub>P(B)P(e)P(a|B,e)P(j|a)P(m|a)，算得 P(B|j,m) ≈ ⟨0.284, 0.716⟩。</p>
<ul>
<li>枚举法概念简单、结果正确，但需重复计算大量子项；n 个布尔变量时复杂度约 O(n·2ⁿ)；</li>
<li><strong>单联通网络</strong>存在与网络规模呈线性的精确推理算法（消息传递/变量消元）；</li>
<li><strong>多联通网络</strong>的精确推理最坏情况为 NP 难 → 必须引入近似推理。</li>
</ul>
<p><span class=&quot;def-term&quot;>【变量消元（variable elimination）】</span>改进的精确推理：按某种次序逐个对隐变量求和消去，把已算过的因子存下来复用，避免枚举法的指数级重复计算（按笔记深度掌握到「概念+为什么比枚举快」即可）。</p>
<h3>4.3 近似推理——采样算法家族（14.5，笔记口径）</h3>
<p><span class=&quot;def-term&quot;>【采样算法】</span>根据已知概率分布生成样本，再在样本基础上做概率统计的方法。</p>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>算法</th><th>核心做法</th><th>特点/局限</th></tr></thead><tbody>
<tr><td>直接采样（前向采样）</td><td>不考虑证据变量值；<strong>按拓扑结构对变量顺序采样</strong>，子结点样本依赖于父结点样本的赋值</td><td>最简单的随机方法；样本数趋于无穷时收敛到真实联合分布（一致性）</td></tr>
<tr><td>拒绝采样</td><td>先直接采样，再丢弃与证据 e 不一致的样本</td><td>证据罕见时大量样本被拒，效率急剧下降</td></tr>
<tr><td>似然加权</td><td>固定证据变量为观测值不采样，其余变量照常采样；每个样本按证据出现的似然（概率乘积）加权</td><td>不浪费样本；证据变量多（似然因子多）时权重退化</td></tr>
<tr><td>MCMC / Gibbs 采样</td><td>从随机状态出发，每步对某个非证据变量按其马尔可夫毯条件分布重新采样，随机游走生成样本链</td><td>不再独立生成样本；是近似推理的主力方法</td></tr>
</tbody></table></div>
<div class=&quot;exam-q&quot;><div class=&quot;q-title&quot;>[2021 机器智能·简答题]（10 分）什么是贝叶斯网络的近似推理？为什么要引入近似推理？</div>
<div class=&quot;q-answer&quot;>近似推理是指根据原有贝叶斯网络的拓扑结构以及条件概率表构造大量的数据样本，再在样本的基础上进行概率统计的方法。（5 分）
精确枚举算法虽然计算正确，但当网络结构复杂、层次很深的时候计算量巨大，而近似推理的方法大大地降低了计算的复杂度。（5 分）</div></div>
<p>备考提示：精确推理（枚举）的计算套路必须亲手算过（见模块六 Asia 真题）；近似推理按「简答题」口径背定义 + 引入原因 + 能说出直接采样的三个要点（不考虑证据、按拓扑序、子依赖父）。</p>
</div></div><div class=&quot;module-card&quot; id=&quot;section-5&quot;><div class=&quot;module-header&quot; onclick=&quot;toggleModule(this)&quot;><h2><span class=&quot;module-num&quot;>5</span>第15章 时间上的概率推理</h2><span class=&quot;module-toggle&quot;>▼</span></div><div class=&quot;module-body&quot;>
<h3>5.1 时间与不确定性（15.1）</h3>
<ul>
<li><strong>静态世界</strong>中随机变量有唯一固定的取值；<strong>动态世界</strong>中随机变量的取值随时间而变；</li>
<li>状态的改变过程可以被视为一系列快照，称为<span class=&quot;def-term&quot;>【时间片（time slice）】</span>；</li>
<li>约定：X<sub>t</sub> 为 t 时刻的状态变量集，E<sub>t</sub> 为 t 时刻的证据变量集；X<sub>a:b</sub> 表示 X<sub>a</sub>,…,X<sub>b</sub>。</li>
</ul>
<h3>5.2 转移模型、传感器模型与两个假设（15.1）</h3>
<p><span class=&quot;def-term&quot;>【转移模型（transition model）】</span>描述在给定过去状态变量的值之后，确定最新状态变量的概率分布 P(X<sub>t</sub>|X<sub>0:t−1</sub>)。随着时间 t 增长，集合 X<sub>0:t−1</sub> 的大小没有约束 → 需要假设来截断历史。</p>
<p><span class=&quot;def-term&quot;>【马尔可夫假设（Markov assumption）】</span>当前状态只依赖于有限的固定数量的过去状态。满足该假设的过程称为<strong>马尔可夫过程</strong>；离散状态、离散时间的马尔可夫过程称为<strong>马尔可夫链（Markov chain）</strong>。</p>
<ul>
<li><strong>一阶马尔可夫过程</strong>：当前状态只依赖于前一个状态，P(X<sub>t</sub>|X<sub>0:t−1</sub>) = P(X<sub>t</sub>|X<sub>t−1</sub>)；</li>
<li><strong>二阶马尔可夫过程</strong>：当前状态只依赖于前两个状态。</li>
</ul>
<p><span class=&quot;def-term&quot;>【传感器模型（观察模型）】</span>证据变量 E<sub>t</sub> 可能依赖于前面的变量，也依赖于当前的状态变量。<span class=&quot;def-term&quot;>【传感器马尔可夫假设】</span>当前的状态产生当前的传感器值：P(E<sub>t</sub>|X<sub>0:t</sub>, E<sub>0:t−1</sub>) = P(E<sub>t</sub>|X<sub>t</sub>)。</p>
<p><span class=&quot;def-term&quot;>【稳态过程 / 平稳性假设】</span>转移模型和传感器模型对所有时间片 t 都相同，即 P(X<sub>t</sub>|X<sub>t−1</sub>)、P(E<sub>t</sub>|X<sub>t</sub>) 对所有 t 都是相同的（转移概率相同）。</p>

BbdCoVAoFAqFQpGL+D+gnjIkMedHQwAAAABJRU5ErkJggg==&quot; alt=&quot;▲ 课件原图（同班同学笔记·第十二讲）：马尔可夫模型概述——马尔可夫假设使联合分布化简为 P(X₁)ΠP(Xt|Xt-1)，并隐含「过去与未来条件独立于现在」。&quot;><div class=&quot;fig-cap&quot;>▲ 课件原图（同班同学笔记·第十二讲）：马尔可夫模型概述——马尔可夫假设使联合分布化简为 P(X₁)ΠP(Xt|Xt-1)，并隐含「过去与未来条件独立于现在」。</div></div>
<p>由马尔可夫假设 + 平稳性，马尔可夫链的联合分布化简为：P(X₁,…,X<sub>T</sub>) = P(X₁)·Π<sub>t=2..T</sub> P(X<sub>t</sub>|X<sub>t−1</sub>)。</p>
<p><strong>马尔可夫链的独立性</strong>：对于一阶马尔可夫链，「不相邻即（条件）独立」——若 t₁&lt;t₂&lt;t₃（或 t₁&gt;t₂&gt;t₃），则 X<sub>t₁</sub>⊥X<sub>t₃</sub>|X<sub>t₂</sub>（给定现在，过去与未来独立）。</p>
<p><span class=&quot;def-term&quot;>【稳态分布（stationary distribution）】</span>随着时间推移，初始分布的影响越来越少，链收敛到一个固定分布。求法（笔记口诀）：设第 ∞ 天与第 ∞+1 天分布相同，列方程组 π = π·T（各状态流入=流出）+ Σπ=1 求解。<strong>应用</strong>：Web 链接分析（PageRank）、应用内程序的平稳分布。</p>
<h3>5.3 隐马尔可夫模型 HMM（15.2～15.3）</h3>
<p>对大多数问题，纯粹的马尔可夫链不太有用——<strong>需要观察来更新信念</strong>。<span class=&quot;def-term&quot;>【隐马尔可夫模型（Hidden Markov Model, HMM）】</span>用单个随机变量描述过程状态的时序概率模型：一条潜在的马尔可夫链状态 X（隐含状态链），每个步产生一个观察输出（可见的观察链）。若模型有多个变量，可将多个变量组合成单个「大变量」。HMM 是只含一个状态变量+一个证据变量的最简单<strong>动态贝叶斯网络</strong>。</p>

<h3>5.4 HMM 的四大推理任务（15.2）</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>任务</th><th>目标式</th><th>含义</th><th>算法</th></tr></thead><tbody>
<tr><td>滤波 filtering（监视）</td><td>P(X<sub>t</sub>|e<sub>1:t</sub>)</td><td>用到目前为止的证据估计当前状态（信念状态）</td><td>前向算法（在线递推）</td></tr>
<tr><td>预测 prediction</td><td>P(X<sub>t+k</sub>|e<sub>1:t</sub>)，k&gt;0</td><td>由现有证据外推未来状态</td><td>滤波后不再加证据地继续递推</td></tr>
<tr><td>平滑 smoothing</td><td>P(X<sub>k</sub>|e<sub>1:t</sub>)，k&lt;t</td><td>用全部证据回头修正对过去状态的估计</td><td>前向-后向算法（离线）</td></tr>
<tr><td>最可能解释</td><td>argmax<sub>x1:t</sub> P(x<sub>1:t</sub>|e<sub>1:t</sub>)</td><td>找最可能产生观察序列的整条隐藏状态路径</td><td>Viterbi 算法（动态规划，max 替代求和）</td></tr>
</tbody></table></div>
<p><strong>前向算法递推式（滤波，考试必考计算）：</strong></p>
<div class=&quot;formula&quot;>f<sub>1:t+1</sub> = P(X<sub>t+1</sub>|e<sub>1:t+1</sub>) = α · P(e<sub>t+1</sub>|X<sub>t+1</sub>) · Σ<sub>xt</sub> P(X<sub>t+1</sub>|x<sub>t</sub>) · f<sub>1:t</sub>(x<sub>t</sub>)</div>
<p>考试口径（对照 2019/2020 期末真题答案）：从初始状态出发，对每个时间片 <strong>t=1,2,3,…</strong>：先用转移概率加权求和（预测），再乘上该时刻观察的传感器概率（更新）；序列发生概率 = 最后时刻各隐藏状态概率之和；「最可能的隐藏状态」逐时刻取 max（试卷按此给分，为贪心近似口径）。</p>
<h3>5.5 连续状态与近似滤波（15.4～15.5，概念掌握）</h3>
<p><span class=&quot;def-term&quot;>【卡尔曼滤波（Kalman filtering）】</span>针对<strong>连续状态变量</strong>、转移模型与传感器模型均为<strong>线性高斯</strong>（线性变换+高斯噪声）的时序模型给出的精确滤波方法；信念状态用均值与协方差表示，递推更新。应用：目标跟踪、导航定位。</p>
<p><span class=&quot;def-term&quot;>【粒子滤波（particle filtering）】</span>针对大状态空间/非高斯模型的<strong>近似滤波</strong>：用一组样本（粒子）近似表示当前信念状态，每步循环「按转移模型传播粒子 → 按证据（传感器模型）给粒子加权 → 按权重重采样」。是 14 章采样思想在时序模型中的延伸。</p>

<h3>6.2 考点一：贝叶斯法则与全概率计算</h3>
<div class=&quot;exam-q&quot;><div class=&quot;q-title&quot;>[2021 机器智能·二(a)]（6 分）Pacman 遇到怪兽时从口袋掏一种零食吃：吃巧克力(+p) 战斗获胜(+w) 概率 70%，吃豆子(−p) 获胜概率只有 20%。口袋里有 5 块巧克力和 15 粒豆子。求：(1) Pacman 战斗获胜的概率；(2) 已知获胜，是因为吃了巧克力的概率。</div>
<div class=&quot;q-answer&quot;>P(+p)=5/20=0.25，P(−p)=0.75。
(1) 全概率：P(+w)=P(+w|+p)P(+p)+P(+w|−p)P(−p)=0.7×0.25+0.2×0.75=7/40+6/40=13/40=0.325
(2) 贝叶斯法则：P(+p|+w)=P(+w|+p)P(+p)/P(+w)=(0.7×0.25)/0.325=7/13≈0.538</div></div>
<div class=&quot;exam-q&quot;><div class=&quot;q-title&quot;>[2022 机器智能·二(a)(b)]（13 分）5 种包装 h1～h5 中草莓味糖果比例为 100%、75%、50%、25%、0%，先验分布 P(h)=⟨0.1, 0.2, 0.4, 0.2, 0.1⟩。每次拿糖果相互独立。(a) 连续拿出 2 颗都是草莓味，逐次求 h1～h5 的后验概率；(b) 预测下一颗是草莓味的概率。</div>
<div class=&quot;q-answer&quot;>(a) 第 1 颗草莓后：P(hᵢ|草莓)=α·P(草莓|hᵢ)P(hᵢ)=α⟨0.1, 0.15, 0.2, 0.05, 0⟩=⟨0.2, 0.3, 0.4, 0.1, 0⟩
第 2 颗草莓后：α⟨0.1×1, 0.15×0.75, 0.2×0.5, 0.05×0.25, 0⟩=α⟨0.1, 0.1125, 0.1, 0.0125, 0⟩=⟨0.308, 0.346, 0.308, 0.043, 0⟩
(b) P(下一颗草莓|数据)=Σᵢ P(草莓|hᵢ)P(hᵢ|数据)=0.308+0.346×0.75+0.308×0.5+0.043×0.25+0≈0.732
要点：每拿到一颗糖就做一次贝叶斯更新（后验变先验），预测时对假设空间边缘化。</div></div>

<div class=&quot;q-answer&quot;>官方答案：a) F　b) T　c) F　d) T　e) F
分析要点：a. A→B 直接相连，不独立（F）；
b. A 到 D 的主路径 A→B→D 被观测结点 B 阻断（链式），另一路径 A→F→G←D 在碰撞结点 G 处阻断（G 未观测），故独立（T）；
c. 存在活跃路径 G←F←A→B←E：B 是碰撞结点（A→B←E）且被观测，路径打开，不独立（F）；
d. F 到 C 的路径或经未观测碰撞结点 G（F→G←D←B←C）、或经未观测碰撞结点 B（F←A→B←C），全部阻断，独立（T）；
e. 路径 C→B←E→H 中碰撞结点 B 的后代 G 被观测（D 分离准则：观测碰撞结点或其后代都会打开碰撞路径），不独立（F）。
方法：枚举所有无向路径 → 逐条找三元组（同父/链式看中间结点是否观测，V 型看碰撞结点及后代是否观测）→ 全部阻断才独立。</div></div>
<div class=&quot;exam-q&quot;><div class=&quot;q-title&quot;>[2021 机器智能·二(c)]（6 分）对 Pacman 网络（M→W←P→B，M⊥P），判断：W⊥B|P、M⊥P|W、M⊥B|P、M⊥B|W、W⊥B、M⊥P。</div>
<div class=&quot;q-answer&quot;>W⊥B|P（F）｜M⊥P|W（T）｜M⊥B|P（T）｜M⊥B|W（F）｜W⊥B（T）｜M⊥P（T）
提示：M→W←P 是 V 型，未观测 W 时 M⊥P（T）；W、B 共享原因 P，未观测 P 时相关，观测 P 后独立——但题目 W⊥B|P 为 F，注意 W 的另一父结点 M 仍会传递影响，做题时逐条路径核对。</div></div>

<h3>6.7 考点六：概念简答</h3>
<div class=&quot;exam-q&quot;><div class=&quot;q-title&quot;>[2021 机器智能·一(a)]（10 分）什么是贝叶斯网络的近似推理？为什么要引入近似推理？</div>
<div class=&quot;q-answer&quot;>近似推理：根据原有贝叶斯网络的拓扑结构以及条件概率表构造大量的数据样本，再在样本的基础上进行概率统计的方法。
原因：精确枚举算法虽然计算正确，但当网络结构复杂、层次很深时计算量巨大，近似推理大大降低了计算复杂度。</div></div>
</div></div><div class=&quot;module-card&quot; id=&quot;section-7&quot;><div class=&quot;module-header&quot; onclick=&quot;toggleModule(this)&quot;><h2><span class=&quot;module-num&quot;>7</span>易混淆概念辨析</h2><span class=&quot;module-toggle&quot;>▼</span></div><div class=&quot;module-body&quot;>
<h3>7.1 先验概率 vs 后验概率</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>维度</th><th>先验概率（无条件概率）</th><th>后验概率（条件概率）</th></tr></thead><tbody>
<tr><td>定义</td><td>不知道其他任何信息时对命题的信念度</td><td>已知证据条件下对命题的信念度</td></tr>
<tr><td>记号</td><td>P(a)</td><td>P(a|b)</td></tr>
<tr><td>联系</td><td colspan=&quot;2&quot;>贝叶斯法则：后验 = 似然 × 先验 ÷ 证据；新证据到来后，旧后验成为新先验（序贯更新，2022 糖果题）</td></tr>
</tbody></table></div>
<h3>7.2 无条件独立 vs 条件独立</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>维度</th><th>（绝对/边缘）独立</th><th>条件独立</th></tr></thead><tbody>
<tr><td>定义</td><td>P(a∧b)=P(a)P(b)</td><td>P(x,y|z)=P(x|z)P(y|z)</td></tr>
<tr><td>现实性</td><td>非常罕见</td><td>不确定环境知识最基本、最鲁棒的形式</td></tr>
<tr><td>作用</td><td>把联合分布拆成乘积</td><td>把完全联合分布从指数级降到接近线性级</td></tr>
<tr><td>注意</td><td colspan=&quot;2&quot;>两者互不蕴含：绝对独立的两变量观测第三变量后可能相关（V 型）；相关变量给定原因后可条件独立（同父/链式）</td></tr>
</tbody></table></div>
<h3>7.3 逻辑 Agent vs 概率 Agent</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>维度</th><th>逻辑 Agent</th><th>概率 Agent</th></tr></thead><tbody>
<tr><td>对语句的态度</td><td>每个语句非真即假</td><td>每个语句赋予 0～1 的信念度</td></tr>
<tr><td>断言方式</td><td>排除断言不成立的世界</td><td>度量各可能世界的可能性</td></tr>
<tr><td>相同点</td><td colspan=&quot;2&quot;>都认为世界由成立或不成立的事实组成</td></tr>
</tbody></table></div>
<h3>7.4 精确推理 vs 近似推理</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>维度</th><th>精确推理（枚举/变量消元）</th><th>近似推理（采样家族）</th></tr></thead><tbody>
<tr><td>结果</td><td>精确后验概率</td><td>样本统计估计，样本数→∞ 收敛（一致性）</td></tr>
<tr><td>复杂度</td><td>单联通线性；多联通 NP 难</td><td>与网络规模基本无关，按样本数计</td></tr>
<tr><td>适用</td><td>小网络、单联通网络</td><td>大规模、深层次、多联通网络</td></tr>
</tbody></table></div>
<h3>7.5 滤波 vs 预测 vs 平滑 vs 最可能解释</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>任务</th><th>目标</th><th>时间关系</th><th>典型应用</th></tr></thead><tbody>
<tr><td>滤波</td><td>P(Xt|e1:t)</td><td>估计「现在」</td><td>在线状态跟踪</td></tr>
<tr><td>预测</td><td>P(Xt+k|e1:t)</td><td>外推「未来」</td><td>天气预报</td></tr>
<tr><td>平滑</td><td>P(Xk|e1:t), k&lt;t</td><td>修正「过去」</td><td>离线数据分析</td></tr>
<tr><td>最可能解释</td><td>argmax P(x1:t|e1:t)</td><td>整条路径</td><td>语音识别（Viterbi）</td></tr>
</tbody></table></div>
<h3>7.6 马尔可夫假设 vs 传感器马尔可夫假设 vs 平稳性假设</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>假设</th><th>内容</th><th>作用对象</th></tr></thead><tbody>
<tr><td>马尔可夫假设</td><td>当前状态只依赖有限固定数量的过去状态（一阶：只依赖前一个）</td><td>截断转移模型的历史：P(Xt|X0:t−1)=P(Xt|Xt−1)</td></tr>
<tr><td>传感器马尔可夫假设</td><td>当前状态产生当前传感器值</td><td>截断证据依赖：P(Et|X0:t,E0:t−1)=P(Et|Xt)</td></tr>
<tr><td>平稳性假设</td><td>转移/传感器模型对所有时间片相同</td><td>让模型参数不随 t 变化，可学习可复用</td></tr>
</tbody></table></div>
<h3>7.7 P(A|B) 与 P(B|A) 混淆（最常见计算错误）</h3>
<ul>
<li>P(effect|Cause) 是「原因→结果」的因果似然（CPT 里直接给）；P(Cause|effect) 是「由果溯因」的诊断后验（要用贝叶斯法则算）；</li>
<li>诊断时必须乘先验并归一化：P(Cause|effect)=α·P(effect|Cause)P(Cause)，先验极低时后验不可能高（脑膜炎例：0.0014）；</li>
<li>答题先写「谁是证据、谁是查询」，再决定用哪个方向。</li>
</ul>

<h3>8.1 必背定义（14 个）</h3>
<div class=&quot;quick-card&quot;><ul>
<li>1. 信念度：知识不能保证目标一定实现，但给出其实现程度的度量；概率 Agent 为每个语句赋 0～1 的数值。</li>
<li>2. 决策理论 = 概率理论 + 效用理论。</li>
<li>3. 期望效用最大化（MEU）：Agent 是理性的，当且仅当它选择能产生最高期望效用的行动。</li>
<li>4. 样本空间 Ω：所有可能世界组成的集合（互斥、完备），ΣP(ω)=1。</li>
<li>5. 先验概率：不知道其他信息时的信念度；后验概率：已知证据后的信念度。</li>
<li>6. 完全联合概率分布：对所有变量赋值概率，是概率推理的「知识库」。</li>
<li>7. 独立性：P(a∧b)=P(a)P(b)；条件独立：P(x,y|z)=P(x|z)P(y|z)。</li>
<li>8. 贝叶斯网络：表示变量间条件独立关系的有向无环图，结点+有向边+每结点 CPT。</li>
<li>9. 单联通网络：任意两结点至多一条无向路径，精确推理线性复杂度。</li>
<li>10. 马尔可夫假设：当前状态只依赖有限固定数量的过去状态。</li>
<li>11. 传感器马尔可夫假设：P(Et|X0:t,E0:t−1)=P(Et|Xt)。</li>
<li>12. 稳态过程：转移与传感器模型对所有时间片相同。</li>
<li>13. HMM：单个状态变量描述过程状态的时序概率模型 = 隐含马尔可夫链 + 每步观察。</li>
<li>14. 稳态分布：初始分布影响随时间衰减后收敛到的固定分布（π=πT 求解）。</li>
</ul></div>
<h3>8.2 必背公式</h3>
<div class=&quot;formula&quot;>① 条件概率：P(a|b)=P(a∧b)/P(b)　② 乘法规则：P(a∧b)=P(a|b)P(b)
③ 全概率：P(b)=ΣᵢP(b|aᵢ)P(aᵢ)　④ 贝叶斯：P(b|a)=P(a|b)P(b)/P(a)，归一化形式 P(Cause|e)=αP(e|Cause)P(Cause)
⑤ 朴素贝叶斯：P(Cause,e₁..eₙ)=P(Cause)ΠP(eᵢ|Cause)
⑥ 网络语义：P(x₁..xₙ)=ΠP(xᵢ|Parents(Xᵢ))
⑦ 马尔可夫链：P(X₁..X_T)=P(X₁)ΠP(Xt|Xt−1)
⑧ 前向递推：f₁:ₜ₊₁=α·P(eₜ₊₁|Xₜ₊₁)·Σ P(Xₜ₊₁|xₜ)f₁:ₜ(xₜ)</div>
<h3>8.3 计算题答题模板</h3>
<div class=&quot;table-wrap&quot;><table><thead><tr><th>题型</th><th>标准步骤</th></tr></thead><tbody>
<tr><td>网络联合概率</td><td>按拓扑序把每个变量的 CPT 因子相乘（双亲取值要与题目一致）</td></tr>
<tr><td>网络条件概率</td><td>① 分子分母分别写成联合概率的和（隐变量求和）→ ② 逐项乘 CPT → ③ 归一化（先算 α 倍再除总和）</td></tr>
<tr><td>HMM 序列概率</td><td>① t=1：初始状态×传感器概率 → ② t≥2：Σ(上一步×转移)×传感器 → ③ 最后时刻各状态求和</td></tr>
<tr><td>最可能隐藏状态</td><td>逐时刻比较各隐藏状态的前向概率，取 max（试卷口径）</td></tr>
<tr><td>独立性判断</td><td>枚举两结点间所有无向路径 → 检查每条路径的三元组结构（同父/链式/V型）→ 全部阻断才独立；V 型观测碰撞点（或其后代）会打开路径</td></tr>
<tr><td>朴素贝叶斯分类</td><td>P(C)×ΠP(Xᵢ|C) 各类分别算，取大者；注意条件独立假设</td></tr>
</tbody></table></div>
<h3>8.4 考场易错点</h3>
<ul>
<li>归一化常数 α 最后一步千万别丢——先分别算分子，再除以两者之和。</li>
<li>画贝叶斯网络必须「原因在前、结果在后」（2021 Pacman 题明确要求），箭头方向反了整题错。</li>
<li>CPT 查表时认准条件栏：P(+b|+m) 与 P(+b|−m) 别抄串行。</li>
<li>HMM 递推先「转移」后「观测」，顺序反了数值全错。</li>
<li>独立性判断要写「路径分析过程」，只写 T/F 没有过程分。</li>
<li>答 HMM 画图题：3 个时间节点 + 转移表 + 传感器表，缺一不可（9 分构成）。</li>
</ul>

  if (e.touches.length !== 1) return;

  if (!isDragging) return;

      _ticking = false;

    _ticking = true;
  }
});

<script>
var BRANCH_META = [
  { key:'branch0', name:'第13章 不确定性的量化', short:'第13章 量化', color:'#2e5c8a', light:'#e8f1fb', groups:[{ short:'不确定性与决策', kids:[['不确定环境行动','uncertain_action'],['信念度','belief_degree'],['决策理论=概率+效用','decision_theory'],['期望效用最大化','meu']]},{ short:'概率符号', kids:[['样本空间Ω','sample_space'],['随机变量与分布','random_var'],['先验与后验概率','prior_posterior'],['完全联合分布','full_joint']]},{ short:'公理与规则', kids:[['柯尔莫哥洛夫公理','kolmogorov'],['条件概率与链式规则','cond_prob'],['全概率公式','total_prob'],['独立与条件独立','independence']]},{ short:'贝叶斯法则', kids:[['贝叶斯规则','bayes_rule'],['归一化常数α','normalize_alpha'],['朴素贝叶斯','naive_bayes']]}]},
  { key:'branch1', name:'第14章 贝叶斯网络', short:'第14章 网络', color:'#2d7a2d', light:'#eaf7e8', groups:[{ short:'表示与语义', kids:[['网络定义与CPT','bn_def'],['联合分布语义','bn_semantics'],['构建：原因→结果','bn_build'],['报警网络经典例','bn_burglary']]},{ short:'条件独立与D分离', kids:[['三种基本结构','bn_structures'],['D分离','d_sep'],['moral图注记','moral_graph']]},{ short:'网络推理', kids:[['推理任务三要素','infer_task'],['枚举精确推理','exact_enum'],['变量消元概念','var_elim'],['直接采样','sample_direct'],['拒绝采样与似然加权','sample_reject_lw'],['MCMC与Gibbs','sample_mcmc']]}]},
  { key:'branch2', name:'第15章 时序概率推理', short:'第15章 时序', color:'#9a6b00', light:'#fff7e6', groups:[{ short:'马尔可夫模型', kids:[['时间与时间片','time_slice'],['马尔可夫假设','markov_assumption'],['转移与传感器模型','trans_sensor'],['平稳性与稳态分布','stationarity']]},{ short:'隐马尔可夫模型', kids:[['HMM结构','hmm_def'],['滤波 filtering','hmm_filter'],['预测与平滑','hmm_predict_smooth'],['最可能解释Viterbi','hmm_viterbi']]},{ short:'连续与近似', kids:[['卡尔曼滤波','kalman'],['粒子滤波','particle_filter']]}]},
  { key:'branch3', name:'真题考点地图', short:'真题考点', color:'#5b2c8a', light:'#f3ecfb', groups:[{ short:'计算大题', kids:[['网络概率计算','exam_bn_calc'],['HMM前向算法','exam_hmm'],['朴素贝叶斯分类','exam_nb']]},{ short:'判断与简答', kids:[['独立性D分离判断','exam_dsep'],['近似推理简答','exam_approx']]}]}
];

var branchInfo = {
  branch0: { title: '第13章 不确定性的量化', content: '<p>核心问题：Agent 如何表示与计算不确定性。</p><p>概率 Agent 为每个语句赋予 0～1 的信念度；<strong>决策理论=概率理论+效用理论</strong>，理性 Agent 选择期望效用最大的行动。</p><p>工具箱：概率公理、条件概率、全概率、<strong>贝叶斯法则</strong>与朴素贝叶斯——这是后两章的语言地基。</p>' },
  branch1: { title: '第14章 贝叶斯网络', content: '<p>核心问题：如何紧凑表示并高效推理大规模联合概率分布。</p><p>贝叶斯网络 = DAG + 每结点 CPT；语义 <strong>P(x₁..xₙ)=ΠP(xᵢ|Parents(Xᵢ))</strong>，靠条件独立把指数级分布压到近线性。</p><p>推理分两类：精确推理（枚举、变量消元）与近似推理（采样家族）。</p>' },
  branch2: { title: '第15章 时序概率推理', content: '<p>核心问题：状态随时间变化时如何递推信念。</p><p>两大假设截断历史：<strong>马尔可夫假设</strong>（当前状态只依赖前一个状态）与<strong>传感器马尔可夫假设</strong>（当前状态产生当前观察），再加<strong>平稳性假设</strong>。</p><p>HMM = 隐含状态链 + 观察链；四大任务：滤波、预测、平滑、最可能解释（Viterbi）。</p>' },
  branch3: { title: '真题考点地图', content: '<p>命题规律：<strong>贝叶斯网络与 HMM 几乎每年各占一道 20 分大题</strong>。</p><p>固定套路：画网络（原因→结果）→ 联合概率乘 CPT → 条件概率归一化；画 HMM（3 个时间点）→ 前向递推 → 求和得序列概率、逐时刻取 max 得最可能状态。</p><p>判断题：三种基本结构 + D 分离路径分析。</p>' }
};

var nodeInfo = {
  center: { title: '第十三至十五章 不确定性推理', content: '<p>三章递进主线：<strong>第13章概率语言 → 第14章贝叶斯网络 → 第15章时序模型</strong>。</p><p>第15章的符号体系（条件概率、条件独立、网络语义）全部建立在第13、14章之上；HMM 本质是最简单的动态贝叶斯网络。</p><p>复习顺序建议：先把 13 章公式背熟，再攻克 14 章网络计算，最后用 15 章 HMM 大题收束。</p>' },
  uncertain_action: { title: '不确定环境下的行动', content: '<p>Agent 环境可能<strong>部分可观察或不确定</strong>（或两者兼有）。逻辑 Agent 必须考虑每种逻辑上可能的解释（信念状态），表示庞大复杂；概率 Agent 用信念度量化可能性，直接计算行动期望效用来决策。</p>' },
  belief_degree: { title: '信念度', content: '<p>Agent 拥有的知识不能保证实现其中任何一个目标，但可以提供它们<strong>在某种程度上将被实现</strong>的度量。概率 Agent 为每个语句赋予 0～1 之间的数值作为信念度。</p><p>对照：逻辑 Agent 相信每个语句非真即假；两者都认为世界由成立或不成立的事实组成。</p>' },
  decision_theory: { title: '决策理论=概率+效用', content: '<p><strong>决策理论 = 概率理论 + 效用理论</strong>。效用理论：Agent 偏好效用更高的状态；概率理论：度量各结果的可能性。两者相乘求和即期望效用。</p>' },
  meu: { title: '期望效用最大化 MEU', content: '<p>一个 Agent 是理性的，当且仅当它选择能产生<strong>最高期望效用</strong>的行动，称为期望效用最大化原则（MEU）。「期望」即统计学的平均。</p><p>逻辑断言排除断言不成立的世界；概率断言度量各可能世界的可能性大小。</p>' },
  sample_space: { title: '样本空间 Ω', content: '<p><strong>样本空间 Ω</strong>：所有可能世界组成的集合，互斥且完备；ω 是其中一个特定的可能世界。</p><p>基本公理：每个可能世界有 0～1 的概率，且 ΣP(ω)=1。命题/事件 f 的概率 P(f)=Σ_{ω∈f}P(ω)。</p>' },
  random_var: { title: '随机变量与概率分布', content: '<p><strong>随机变量</strong>是概率模型的基本元素（大写字母开头，如 Total、Weather），定义域为其所有可能取值。A=true 简写 a，A=false 简写 ¬a。</p><p><strong>概率分布</strong>为变量所有可能取值赋概率，和为 1，如 P(Weather)=⟨0.6, 0.1, 0.29, 0.01⟩。连续变量用概率密度函数描述。</p>' },
  prior_posterior: { title: '先验与后验概率', content: '<p><strong>先验概率（无条件概率）</strong>：不知道其他任何信息时对命题的信念度 P(a)。</p><p><strong>后验概率（条件概率）</strong>：已知证据后对命题的信念度 P(a|b)。贝叶斯法则把二者相连：后验 = 似然×先验÷证据；序贯更新中旧后验变新先验。</p>' },
  full_joint: { title: '完全联合概率分布', content: '<p>对多个随机变量中每个变量发生的可能性进行概率赋值。<strong>把完全联合概率分布当作「知识库」，从中可导出所有问题的答案</strong>（任意边缘概率、条件概率都可由它求和得到）。</p><p>痛点：n 个布尔变量需要 2ⁿ 个表项 → 引出第14章贝叶斯网络。</p>' },
  kolmogorov: { title: '柯尔莫哥洛夫公理', content: '<p>三条基石：① 每个可能世界 0≤P(ω)≤1；② 样本空间总概率 ΣP(ω)=1；③ 命题概率 P(f)=Σ_{ω∈f}P(ω)。</p><p>推论（包含-排斥原理）：P(A∩B)+P(A∪B)=P(A)+P(B)。</p>' },
  cond_prob: { title: '条件概率与链式规则', content: '<p><strong>条件概率</strong>：P(a|b)=P(a∧b)/P(b)（P(b)&gt;0）。</p><p><strong>乘法规则</strong>：P(a∧b)=P(a|b)P(b)=P(b|a)P(a)。</p><p><strong>链式规则</strong>：P(x₁..xₙ)=P(xₙ|x₁..xₙ₋₁)·…·P(x₂|x₁)·P(x₁)=ΠP(Xᵢ|Xᵢ₋₁..X₁)——14 章网络语义由此化简而来。</p>' },
  total_prob: { title: '全概率公式', content: '<p>P(b)=Σᵢ P(b|aᵢ)P(aᵢ)，其中 {aᵢ} 是样本空间的一个划分。</p><p>用途：① 求证据的边缘概率（贝叶斯公式分母）；② 对隐变量求和做边缘化；③ 2021 Pacman 题求胜率 P(+w)=0.325 即此公式。</p>' },
  independence: { title: '独立与条件独立', content: '<p><strong>独立</strong> a⊥b：P(a|b)=P(a) ⇔ P(b|a)=P(b) ⇔ P(a∧b)=P(a)P(b)。</p><p><strong>条件独立</strong> X⊥Y|Z：P(x,y|z)=P(x|z)P(y|z) ⇔ P(x|y,z)=P(x|z)。</p><p>绝对独立罕见；条件独立是不确定环境知识最基本、最鲁棒的形式，能把完全联合分布从指数级降到接近线性级。</p>' },
  bayes_rule: { title: '贝叶斯规则', content: '<p>由乘法规则两种写法相等直接推出：<strong>P(b|a)=P(a|b)P(b)/P(a)</strong>。</p><p>诊断方向：P(Cause|effect)=P(effect|Cause)P(Cause)/P(effect)——把未知原因造成的结果看作证据反推原因。</p><p>教材例：P(m|s)=0.7×(1/50000)/0.01=0.0014——先验极低时后验仍小。</p>' },
  normalize_alpha: { title: '归一化常数 α', content: '<p>P(Cause|e)=α·P(e|Cause)P(Cause)，α=1/P(e) 使各取值概率和为 1。</p><p>考试最快流程：<strong>分子分别算 → 相加得总和 → 各自除以总和</strong>，避免直接算 P(e)。几乎所有网络计算大题的最后一步都是归一化。</p>' },
  naive_bayes: { title: '朴素贝叶斯', content: '<p>假设所有 Effectᵢ 在给定 Cause 时相互条件独立：</p><p><strong>P(Cause, e₁..eₙ)=P(Cause)·ΠᵢP(eᵢ|Cause)</strong></p><p>参数规模从 2ⁿ 降到 O(n)；2020 期末样例学习题、2022 机器智能题均考分类计算。</p>' },
  bn_def: { title: '贝叶斯网络定义与CPT', content: '<p><strong>贝叶斯网络</strong>：表示变量间条件独立关系的有向无环图（信度网/概率网络/因果网络/知识图）。三要素：结点=随机变量；有向边=直接依赖；每结点带条件概率分布 P(Xᵢ|Parents)。</p><p>CPT（条件概率表）列出父结点每种组合下子结点取值的概率。确定性结点由父结点完全决定；不确定性结点带概率。</p>' },
  bn_semantics: { title: '联合分布语义', content: '<p><strong>P(x₁,…,xₙ)=Πᵢ P(xᵢ|Parents(Xᵢ))</strong>——链式规则+条件独立的化简结果。</p><p>结构语义：给定父结点后，每个结点与其非后代结点条件独立（局部马尔可夫性）。</p><p>计算套路：按拓扑序把各因子相乘即得任意联合概率（2020 期末 0.4374、2021 期末 1.19×10⁻⁴）。</p>' },
  bn_build: { title: '构建：原因→结果', content: '<p>构建原则：<strong>由原因指向结果</strong>——先画原因结点，再画受其直接影响的结果；按拓扑序逐个添加并填 CPT。</p><p>因果方向使网络更稀疏、CPT 更小、参数更符合直觉。2021 Pacman 题明确要求「原因在前，结果在后」。</p>' },
  bn_burglary: { title: '报警网络经典例', content: '<p>教材图 14.2：Burglary、Earthquake → Alarm → JohnCalls、MaryCalls。</p><p>联合概率：P(j∧m∧a∧¬b∧¬e)=0.90×0.70×0.001×0.999×0.998≈0.000628。</p><p>枚举推理：P(B|j,m)≈⟨0.284, 0.716⟩。同时演示「解释消除」：听到警报更信盗窃，再听说地震会削弱对盗窃的信念。</p>' },
  bn_structures: { title: '三种基本结构', content: '<p><strong>同父（共同原因）</strong> A←C→B：C 未观测时 A、B 相关；观测 C 后 A⊥B|C。</p><p><strong>链式（顺序）</strong> A→B→C：B 未观测时相关；观测 B 后 A⊥C|B。</p><p><strong>V 型（汇聚/碰撞）</strong> A→C←B：C 未观测时 A⊥B；观测 C（或其后代）后 A、B 相关（解释消除）。</p><p>口诀：同父链式「观测则断」，V 型「观测则通」。</p>' },
  d_sep: { title: 'D 分离', content: '<p><strong>D 分离</strong>：判断任意两结点在给定观测集合下是否条件独立的图准则——枚举两结点间所有无向路径，每条路径上若存在被阻断的三元组（同父/链式中间结点被观测，或 V 型碰撞结点及后代均未观测）则该路径阻断；全部路径阻断 ⇒ D 分离 ⇒ 条件独立。</p><p>2020 期末 5 道判断（F T F T F）、2021 机器智能 6 道判断均考此。</p>' },
  moral_graph: { title: 'moral 图注记', content: '<p>笔记要点：<strong>moral 图只能确认独立性，不能排除非独立性</strong>——moral 图中连通不代表一定不独立，严格判断须回到 D 分离路径分析。</p><p>moral 图构造：取祖先集 + 把共同父结点两两相连（「结婚」）+ 去掉方向 + 删除观测结点。</p>' },
  infer_task: { title: '推理任务三要素', content: '<p>概率推理 = 根据已观察到的证据计算查询命题的后验概率。变量角色：<strong>查询变量 X</strong>（求后验）、<strong>证据变量 E</strong>（已观测）、<strong>隐变量 Y</strong>（求和消去）。</p><p>推理方向：因果推理（由因推果）、诊断推理（由果推因）、二者混合。</p>' },
  exact_enum: { title: '枚举精确推理', content: '<p><strong>P(X|e)=α·Σ_y P(X,e,y)</strong>：联合分布对隐变量求和，按网络语义展开逐项乘 CPT，最后归一化。</p><p>例：P(B|j,m)≈⟨0.284,0.716⟩。复杂度约 O(n·2ⁿ)；单联通网络有线性算法，多联通网络精确推理 NP 难。</p>' },
  var_elim: { title: '变量消元概念', content: '<p><strong>变量消元</strong>：改进的精确推理——按某次序逐个对隐变量求和消去，把算过的因子存为中间结果复用，避免枚举法的指数级重复计算。</p><p>笔记深度：掌握「为什么比枚举快」即可。</p>' },
  sample_direct: { title: '直接采样', content: '<p><strong>直接采样（前向采样）</strong>：不考虑证据变量值；<strong>按拓扑结构对变量顺序采样</strong>；子结点样本依赖父结点样本的赋值。</p><p>最简单的随机方法；样本数→∞ 时频率收敛到真实概率（一致性）。</p>' },
  sample_reject_lw: { title: '拒绝采样与似然加权', content: '<p><strong>拒绝采样</strong>：直接采样后丢弃与证据不一致的样本；证据罕见时效率急剧下降。</p><p><strong>似然加权</strong>：证据变量固定为观测值不采样，其余照常采样，样本按证据似然加权；不浪费样本，但证据多时权重退化。</p>' },
  sample_mcmc: { title: 'MCMC 与 Gibbs', content: '<p><strong>MCMC（马尔可夫链蒙特卡洛）</strong>：从随机状态出发，每步对某个非证据变量按其马尔可夫毯条件分布重新采样，随机游走生成样本链；Gibbs 是其代表。</p><p>是大规模网络近似推理的主力方法。</p>' },
  time_slice: { title: '时间与时间片', content: '<p>静态世界中随机变量有唯一固定取值；动态世界中取值随时间变化。</p><p>状态变化过程视为一系列快照——<strong>时间片（time slice）</strong>；Xt 为状态变量、Et 为证据变量，X_{a:b} 表示区间序列。</p>' },
  markov_assumption: { title: '马尔可夫假设', content: '<p><strong>当前状态只依赖于有限的固定数量的过去状态</strong>。一阶：P(Xt|X0:t−1)=P(Xt|Xt−1)；二阶：依赖前两个状态。</p><p>满足假设的过程 = 马尔可夫过程；离散情形 = 马尔可夫链。独立性推论：给定现在，过去与未来独立（不相邻即条件独立）。</p>' },
  trans_sensor: { title: '转移与传感器模型', content: '<p><strong>转移模型</strong>：P(Xt|X0:t−1) 描述状态演化（马尔可夫假设下化简为 P(Xt|Xt−1)）。</p><p><strong>传感器模型（观察模型）</strong>：证据 Et 的生成机制；<strong>传感器马尔可夫假设</strong>：P(Et|X0:t,E0:t−1)=P(Et|Xt)——当前状态产生当前传感器值。</p>' },
  stationarity: { title: '平稳性与稳态分布', content: '<p><strong>平稳性假设</strong>：转移与传感器模型对所有时间片 t 相同（转移概率不随时间变化）。</p><p><strong>稳态分布</strong>：初始分布影响随时间衰减，链收敛到固定分布。求法（笔记口诀）：令第 ∞ 天与第 ∞+1 天分布相同，列方程 π=πT 且 Σπ=1。应用：Web 链接分析（PageRank）。</p>' },
  hmm_def: { title: 'HMM 结构', content: '<p><strong>隐马尔可夫模型</strong>：用单个随机变量描述过程状态的时序概率模型——一条潜在马尔可夫链（隐含状态链）+ 每步一个观察输出（观察链）。多个变量可组合成单个「大变量」。</p><p>本质：最简单的动态贝叶斯网络（一个状态变量+一个证据变量按时间片展开）。</p>' },
  hmm_filter: { title: '滤波 filtering', content: '<p><strong>滤波</strong>：P(Xt|e1:t)——用目前为止的全部证据估计当前状态（信念状态），在线递推。</p><p>前向递推：f1:t+1=α·P(e_{t+1}|X_{t+1})·Σ P(X_{t+1}|x_t)·f1:t(x_t)——先转移加权求和，再乘传感器概率。</p>' },
  hmm_predict_smooth: { title: '预测与平滑', content: '<p><strong>预测</strong>：P(X_{t+k}|e1:t)（k&gt;0）——滤波后不再加证据地继续按转移模型外推未来。</p><p><strong>平滑</strong>：P(X_k|e1:t)（k&lt;t）——用全部证据回头修正对过去状态的估计（前向-后向算法，离线）。</p>' },
  hmm_viterbi: { title: '最可能解释与 Viterbi', content: '<p><strong>最可能解释</strong>：argmax P(x1:t|e1:t)——找最可能产生观察序列的整条隐藏状态路径。</p><p><strong>Viterbi 算法</strong>：把前向算法中的「求和」换成「取 max」的动态规划。应用：语音识别。</p><p>试卷口径：逐时刻取前向概率最大的状态（2019/2020 期末均按此给分）。</p>' },
  kalman: { title: '卡尔曼滤波', content: '<p><strong>卡尔曼滤波</strong>：连续状态变量 + 线性高斯模型（线性转移/传感器 + 高斯噪声）的<strong>精确</strong>滤波；信念状态用均值与协方差表示并递推更新。</p><p>应用：目标跟踪、导航定位。概念级掌握即可。</p>' },
  particle_filter: { title: '粒子滤波', content: '<p><strong>粒子滤波</strong>：大状态空间/非高斯模型的<strong>近似</strong>滤波——用一组粒子近似信念状态，循环「传播 → 按证据加权 → 重采样」。</p><p>是第14章采样思想在时序模型上的延伸。概念级掌握即可。</p>' },
  exam_bn_calc: { title: '网络概率计算题', content: '<p>四年四道大题：2020 期末臭鸡蛋（联合 0.4374、P(+b)=0.19、P(+m|+b)≈0.5263、P(+m|+s,+b,+e)≈0.5814）；2021 期末 Asia（联合 1.19×10⁻⁴、P(l|s,a,x)≈0.53）；2021 机器智能 Pacman（P(+w|+b,+m)=0.3）；2017 研究生基姆（P(C|W)≈0.55）。</p><p>套路：画网络→联合乘 CPT→条件概率分子分母展开→归一化。</p>' },
  exam_hmm: { title: 'HMM 前向算法题', content: '<p>连续两年 20 分：2020 期末汤姆（酒吧→酒吧→公园，序列概率 0.01021，最可能 {good,good,good}）；2019 期末安迪（smile→cry→smile，序列概率 0.1758，最可能 {happy,hungry,happy}）。</p><p>步骤：t=1 初始×传感器；t≥2 先转移求和再乘传感器；最后求和/取 max。</p>' },
  exam_nb: { title: '朴素贝叶斯分类题', content: '<p>2020 期末：15 条训练数据，P(C=1)=0.6 对 P(C=−1)=0.4，X=(3,S) 两个得分 0.0296 vs 0.0333 → 判 −1 类。</p><p>2022 机器智能：P(+|L,Y)≈0.33 &gt; P(−|L,Y)≈0.22 → 判 + 类。</p><p>关键：给定类别时各特征条件独立，分别乘再比较。</p>' },
  exam_dsep: { title: '独立性 D 分离判断', content: '<p>2020 期末（5 分）：A-H 网络五判断，官方答案 F、T、T、F 中见详解（a.F b.T c.F d.T e.F）。</p><p>2021 机器智能（6 分）：Pacman 网络六判断——W⊥B|P(F)、M⊥P|W(T)、M⊥B|P(T)、M⊥B|W(F)、W⊥B(T)、M⊥P(T)。</p><p>方法：枚举所有路径→逐条检查三元组→注意 V 型碰撞结点被观测（含后代）会打开路径。</p>' },
  exam_approx: { title: '近似推理简答', content: '<p>2021 机器智能（10 分）：近似推理 = 按原网络拓扑结构与 CPT 构造大量数据样本，再在样本基础上做概率统计。</p><p>引入原因：精确枚举算法计算正确，但网络复杂、层次深时计算量巨大，近似推理大大降低计算复杂度。</p>' }
};

function leafNode(short, key, meta) {
  return { name: short, short: short, key: key,
    itemStyle: { color: '#ffffff', borderColor: meta.color, borderWidth: 1.2 },
    symbolSize: 7 };
}

function subNode(short, meta) {
  return { name: short, short: short,
    itemStyle: { color: meta.color }, symbolSize: 10,
    label: { color: meta.color, fontWeight: 600 } };
}

var treeData = {
  name: '第十三至十五章 不确定性推理', short: '不确定性推理', key: 'center',
  symbolSize: 16, collapsed: false,
  itemStyle: { color: '#1a365d' },
  label: { color: '#1a365d', fontWeight: 700, fontSize: 14 },
  children: BRANCH_META.map(function(meta) {
    return {
      name: meta.name, short: meta.short, key: meta.key,
      symbolSize: 13, collapsed: false,
      itemStyle: { color: meta.color },
      label: { color: meta.color, fontWeight: 700 },
      children: meta.groups.map(function(g) {
        var sub = subNode(g.short, meta);
        sub.children = g.kids.map(function(k) { return leafNode(k[0], k[1], meta); });
        return sub;
      })
    };
  })
};

var isMobile = window.innerWidth < 600;
var layout = isMobile ? 'LR' : 'radial';
var chart = null;
var chartDone = false;

function buildOption() {
  return {
    animationDuration: 300,
    animationDurationUpdate: 450,
    series: [{
      type: 'tree',
      data: [treeData],
      layout: layout,
      left: '10%', right: '24%', top: '12%', bottom: '12%',
      roam: true,
      symbol: 'circle',
      expandAndCollapse: true,
      initialTreeDepth: -1,
      label: {
        position: layout === 'radial' ? 'radial' : 'right',
        rotate: 0,
        verticalAlign: 'middle',
        align: layout === 'radial' ? undefined : 'left',
        fontSize: isMobile ? 11 : 12,
        color: '#444',
        formatter: function(p) { return p.data.short || p.name; }
      },
      leaves: {
        label: { position: 'right', fontSize: isMobile ? 11 : 12, color: '#555' }
      },
      edgeForkPosition: '65%',
      lineStyle: { color: '#c8cdd4', width: 1.2, curveness: 0.5 },
      emphasis: { itemStyle: { shadowBlur: 8, shadowColor: 'rgba(0,0,0,0.25)' } }
    }]
  };
}

function refresh() {
  if (chart) chart.setOption({ series: [{ data: [treeData] }] });
}

function initChart() {
  var el = document.getElementById('chart');
  if (!window.echarts) {
    el.style.display = 'none';
    document.getElementById('chartFallback').style.display = 'block';
    return;
  }
  chart = echarts.init(el);
  chart.setOption(buildOption());
  chart.on('click', function(p) {
    var d = p.data;
    if (d.children && d.children.length) {
      d.collapsed = !d.collapsed;
      refresh();
    }
    if (d.key) showInfo(d.key);
  });
}

function tryInit() {
  if (chartDone) return;
  var el = document.getElementById('chart');
  if (el.offsetWidth === 0) return;
  if (!window.echarts && !window.echartsFailed) return;
  chartDone = true;
  initChart();
}
window.addEventListener('load', function() { setTimeout(tryInit, 60); });
setInterval(tryInit, 400);
window.addEventListener('resize', function() {
  if (chart) chart.resize();
});

function toggleLayout() {
  layout = layout === 'radial' ? 'LR' : 'radial';
  document.getElementById('layoutBtn').textContent = layout === 'radial' ? '⇄ 切换横向' : '◉ 切换径向';
  if (chart) chart.setOption(buildOption(), true);
}
function resetView() {
  if (chart) chart.setOption(buildOption(), true);
}

function showInfo(key) {
  var info = nodeInfo[key] || branchInfo[key];
  if (!info) return;
  document.getElementById('infoTitle').textContent = info.title;
  document.getElementById('infoContent').innerHTML = info.content;
  document.getElementById('infoPanel').classList.add('show');
  document.getElementById('infoPanelOverlay').classList.add('show');
}
function closeInfo() {
  document.getElementById('infoPanel').classList.remove('show');
  document.getElementById('infoPanelOverlay').classList.remove('show');
}

function setCollapsedDeep(node, collapsed) {
  if (node.children && node.children.length) {
    node.collapsed = collapsed;
    node.children.forEach(function(c) { setCollapsedDeep(c, collapsed); });
  }
}
function expandAll() {
  setCollapsedDeep(treeData, false);
  refresh();
}
function collapseAll() {
  treeData.collapsed = false;
  treeData.children.forEach(function(b) { setCollapsedDeep(b, true); });
  closeInfo();
  refresh();
}

function openNodeNav() {
  document.getElementById('nodeNavPanel').classList.add('show');
  document.getElementById('nodeNavOverlay').classList.add('show');
  generateNodeNav();
}
function closeNodeNav() {
  document.getElementById('nodeNavPanel').classList.remove('show');
  document.getElementById('nodeNavOverlay').classList.remove('show');
}
function findPath(nodes, key, path) {
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    var p2 = path.concat([n]);
    if (n.key === key) return p2;
    if (n.children) {
      var r = findPath(n.children, key, p2);
      if (r) return r;
    }
  }
  return null;
}
function expandTo(key) {
  var path = findPath([treeData], key, []);
  if (!path) return;
  path.forEach(function(n) { n.collapsed = false; });
  refresh();
}
function generateNodeNav() {
  var list = document.getElementById('nodeNavList');
  list.innerHTML = '';
  var center = document.createElement('div');
  center.className = 'node-nav-branch';
  center.innerHTML = '⭐ 第十三至十五章 不确定性推理';
  center.onclick = function() { closeNodeNav(); expandTo('center'); showInfo('center'); };
  list.appendChild(center);
  var icons = ['📖', '📘', '📗', '📙'];
  treeData.children.forEach(function(branch, i) {
    var group = document.createElement('div');
    group.className = 'node-nav-group';
    var title = document.createElement('div');
    title.className = 'node-nav-branch';
    title.innerHTML = icons[i] + ' ' + branch.name;
    title.onclick = function() { closeNodeNav(); expandTo(branch.key); showInfo(branch.key); };
    group.appendChild(title);
    var container = document.createElement('div');
    container.className = 'node-nav-children';
    branch.children.forEach(function(sub) {
      var label = document.createElement('div');
      label.className = 'node-nav-child';
      label.style.fontWeight = '600';
      label.style.color = 'var(--text2)';
      label.textContent = '· ' + (sub.short || sub.name);
      container.appendChild(label);
      sub.children.forEach(function(child) {
        var item = document.createElement('div');
        item.className = 'node-nav-child';
        item.textContent = child.short || child.name;
        item.onclick = function() { closeNodeNav(); expandTo(child.key); showInfo(child.key); };
        container.appendChild(item);
      });
    });
    group.appendChild(container);
    list.appendChild(group);
  });
}
</script>

<script>
var currentTab = 'notes';
var expanded = false;
function switchTab(tab, btn) {
  currentTab = tab;
  expanded = false;
  document.getElementById('expandBtn').textContent = '📂 展开';
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
}
function getActiveIframe() {
  var panel = document.getElementById('panel-' + currentTab);
  return panel ? panel.querySelector('iframe') : null;
}
function openNav() {
  var iframe = getActiveIframe();
  if (!iframe) return;
  try {
    var win = iframe.contentWindow;
    if (currentTab === 'notes') {
      if (win.openSidebar) win.openSidebar();
    } else {
      if (win.openNodeNav) win.openNodeNav();
    }
  } catch(e) { console.error(e); }
}
function toggleExpand() {
  var iframe = getActiveIframe();
  if (!iframe) return;
  try {
    var win = iframe.contentWindow;
    if (!expanded) {
      if (win.expandAll) win.expandAll();
      document.getElementById('expandBtn').textContent = '📁 折叠';
      expanded = true;
    } else {
      if (win.collapseAll) win.collapseAll();
      document.getElementById('expandBtn').textContent = '📂 展开';
      expanded = false;
    }
  } catch(e) { console.error(e); }
}
</script>
